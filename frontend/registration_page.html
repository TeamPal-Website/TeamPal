<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | TeamPal</title>
    <link rel="icon" type="image/png" href="./assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/notify-banner.css">

<style>

.page {
    height: 100vh;
    color: #2d3e56;
    position: relative;
}

body {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-optical-sizing: auto;
  font-weight: 700;
  font-style: normal;
  margin: 0;
  background-color: #fffffc;
}

.form {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.wrapper {
    width: 33%;
    border: 1px solid #0000001a;
    border-radius: 10px;
    padding-left: 20px;
    background: white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}


.wrapper .subtitle, .wrapper button {
    text-align: center;
    color: #2d3e56;
    font-family: "Space Grotesk", system-ui, sans-serif;
}

.wrapper h1 {
    font-size: 42px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 5px;
}

.auth-tabs {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 20px;
}

.auth-tab {
    font-size: 15px;
    font-weight: 500;
    padding: 5px 0;
    cursor: pointer;
    color: #b5b5b5;
    text-decoration: none;
    position: relative;
    transition: color 0.3s;
    letter-spacing: 0.3px;
}

.auth-tab:hover {
    color: #F85A0B;
}

.auth-tab.active {
    color: #F85A0B;
}

.auth-tab.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: #F85A0B;
    border-radius: 2px;
}

.wrapper p {
    font-size: 16px;
    font-weight: 400;
    color: #b5b5b5;
    padding-bottom: 15px;
    text-align: center;
    margin-top: 0;
}

.login_wrapper label {
    font-size: 16px;
    font-weight: 500;

}

.login_wrapper {
    padding-bottom: 20px;
}

.password_wrapper label {
    font-size: 16px;
    font-weight: 500;
}

.password_wrapper {
    padding-bottom: 20px;
}

.consent_wrapper {
    margin-bottom: 20px;
    padding-right: 20px;
}

.consent-checkbox {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.consent-checkbox input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 3px;
    flex-shrink: 0;
    cursor: pointer;
}

.consent-text {
    font-size: 14px;
    line-height: 1.4;
    color: #555;
    cursor: pointer;
}

.consent-text a {
    color: #F85A0B;
    text-decoration: none;
}

.consent-text a:hover {
    text-decoration: underline;
}

input {
    font-size: 16px;
    font-weight: 400;
    background-color: #f5f5f5;
    border: 1px solid transparent;
    border-radius: 7px;
    padding-left: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    width: 94%;
    margin-top: 10px;
    text-align: left;
    box-sizing: border-box;
    transition: all 0.2s;
}

input::placeholder {
    color: #808289;
}

input:focus {
    color: #212529;
    outline: 0;
    border-color: #F85A0B;
    box-shadow: 0 0 0 3px rgba(248, 90, 11, 0.1);
    transition: 0.2s;
}

input.error {
    border-color: #dc2626;
    background-color: #fff5f5;
}

.login_button {
    font-size: 16px;
    background-color: #F85A0B;
    margin-right: 20px;
    margin-bottom: 10px;
    border-radius: 10px;
}

button {
    padding-top: 10px;
    padding-bottom: 10px;
    color: white;
    background-color: black;
    margin-right: 20px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-style: none;
    text-align: center;
    width: 94%;
    cursor: pointer;
    transition: all 0.2s;
}

.login_button:hover {
    background-color: #e64e00;
}

.login_button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}

@media (max-width: 768px) {
    .wrapper {
        width: 85%;
    }
}

</style>
</head>
<body class="page">
    <div class="notification-container" id="notificationContainer"></div>
    
    <form class="form" id="registerForm" action="" method="post">
        <div class="wrapper">
            <h1 class="title">TeamPal</h1>
            
            <div class="auth-tabs">
                <a href="#" class="auth-tab" id="loginTab">Войти</a>
                <a href="#" class="auth-tab active" id="registerTab">Зарегистрироваться</a>
            </div>
            
            <p class="subtitle">Введите ваши данные для регистрации</p>
            <div class="login_wrapper">
                <label for="email">Логин</label>
                <div class="login_input">
                    <input type="email" id="email" name="email" placeholder="Введите почту" required>
                </div>
            </div>
            <div class="password_wrapper">
                <label for="password">Пароль</label>
                <div class="password_input">
                    <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
                </div>
            </div>
            <div class="password_wrapper">
                <label for="confirm_password">Повторите пароль</label>
                <div class="password_input">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите ваш пароль" required>
                </div>
            </div>
            <div class="consent_wrapper">
                <div class="consent-checkbox">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent" class="consent-text">
                        Я даю согласие на обработку моих персональных данных в соответствии с 
                        <a href="#" target="_blank">Политикой конфиденциальности</a>
                    </label>
                </div>
            </div>
            <button class="login_button" type="submit" id="submitBtn">Зарегистрироваться</button>
        </div>
    </form>

    <script src="./config.js"></script>
    <script src="./assets/notify-banner.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const consentCheckbox = document.getElementById('consent');
            const registerForm = document.getElementById('registerForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm_password');
            const submitBtn = document.getElementById('submitBtn');

            function accountPageUrl() {
                try {
                    const role = localStorage.getItem('tp_role');
                    if (role === 'Ищу вакансию') {
                        return './account_employee.html';
                    }
                } catch (e) {}
                return './account_manager.html';
            }
            
            submitBtn.disabled = true;

            function isNetworkError(error) {
                const msg = error && error.message ? error.message : String(error);
                return (
                    (error && error.name === 'TypeError') ||
                    msg === 'Failed to fetch' ||
                    msg === 'Load failed' ||
                    (typeof msg === 'string' && msg.indexOf('NetworkError') !== -1)
                );
            }

            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!email) return 'Поле почты обязательно для заполнения';
                if (!emailRegex.test(email)) return 'Введите корректный email адрес';
                return null;
            }

            function validatePassword(password) {
                if (!password) return 'Поле пароля обязательно для заполнения';
                if (password.length < 6) return 'Пароль должен содержать минимум 6 символов';
                return null;
            }

            function validateConfirmPassword(password, confirmPassword) {
                if (!confirmPassword) return 'Подтверждение пароля обязательно';
                if (password !== confirmPassword) return 'Пароли не совпадают';
                return null;
            }

            function resetFieldErrors() {
                const inputs = [emailInput, passwordInput, confirmPasswordInput];
                inputs.forEach(input => {
                    input.classList.remove('error');
                });
            }

            function setFieldError(input) {
                input.classList.add('error');
            }

            function validateForm() {
                resetFieldErrors();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                const emailError = validateEmail(email);
                if (emailError) {
                    setFieldError(emailInput);
                    return { isValid: false, error: emailError };
                }
                
                const passwordError = validatePassword(password);
                if (passwordError) {
                    setFieldError(passwordInput);
                    return { isValid: false, error: passwordError };
                }
                
                const confirmError = validateConfirmPassword(password, confirmPassword);
                if (confirmError) {
                    setFieldError(confirmPasswordInput);
                    return { isValid: false, error: confirmError };
                }
                
                return { isValid: true, error: null };
            }

            function parseDetail(detail) {
                if (typeof window.tpFormatApiDetail === 'function') {
                    const s = window.tpFormatApiDetail(detail);
                    if (s) return s;
                }
                return 'Ошибка запроса';
            }

            async function getErrorText(response) {
                try {
                    const payload = await response.json();
                    return parseDetail(payload.detail);
                } catch (error) {
                    console.error(error);
                    return 'Ошибка запроса';
                }
            }

            emailInput.addEventListener('blur', function() {
                const error = validateEmail(this.value.trim());
                if (error) {
                    setFieldError(this);
                } else {
                    this.classList.remove('error');
                }
            });
            
            passwordInput.addEventListener('blur', function() {
                const error = validatePassword(this.value);
                if (error) {
                    setFieldError(this);
                } else {
                    this.classList.remove('error');
                }
            });
            
            confirmPasswordInput.addEventListener('blur', function() {
                const error = validateConfirmPassword(passwordInput.value, this.value);
                if (error) {
                    setFieldError(this);
                } else {
                    this.classList.remove('error');
                }
            });

            passwordInput.addEventListener('input', function() {
                if (confirmPasswordInput.value) {
                    const error = validateConfirmPassword(this.value, confirmPasswordInput.value);
                    if (error) {
                        setFieldError(confirmPasswordInput);
                    } else {
                        confirmPasswordInput.classList.remove('error');
                    }
                }
            });
            
            confirmPasswordInput.addEventListener('input', function() {
                const error = validateConfirmPassword(passwordInput.value, this.value);
                if (error) {
                    setFieldError(this);
                } else {
                    this.classList.remove('error');
                }
            });
            
            consentCheckbox.addEventListener('change', function() {
                submitBtn.disabled = !this.checked;
            });
            
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            
            loginTab.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = './authorization_page.html';
            });
            
            registerTab.addEventListener('click', function(e) {
                e.preventDefault();
            });
            
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const validation = validateForm();
                if (!validation.isValid) {
                    showNotification(validation.error, 'error');
                    return;
                }
                
                if (!consentCheckbox.checked) {
                    showNotification('Подтвердите согласие на обработку персональных данных', 'warning');
                    return;
                }
                
                submitBtn.disabled = true;
                
                try {
                    if (typeof API_BASE_URL === 'undefined') {
                        showNotification('Ошибка конфигурации: API_BASE_URL не определен', 'error');
                        submitBtn.disabled = !consentCheckbox.checked;
                        return;
                    }
                    
                    const email = emailInput.value.trim();
                    const password = passwordInput.value;
                    
                    const registerResponse = await fetch(API_BASE_URL + '/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: email,
                            password: password,
                        }),
                    });
                    
                    if (!registerResponse.ok) {
                        const errorText = await getErrorText(registerResponse);
                        showNotification(errorText, 'error');
                        submitBtn.disabled = !consentCheckbox.checked;
                        return;
                    }
                    
                    showNotification('Регистрация успешна. Выполняется вход...', 'success', 3000);
                    
                    const loginResponse = await fetch(API_BASE_URL + '/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: email,
                            password: password,
                        }),
                    });
                    
                    if (!loginResponse.ok) {
                        showNotification('Регистрация успешна. Пожалуйста, войдите в систему.', 'success', 4000);
                        setTimeout(() => {
                            window.location.href = './authorization_page.html';
                        }, 1500);
                        return;
                    }
                    
                    setTimeout(() => {
                        window.location.href = accountPageUrl();
                    }, 1000);
                    
                } catch (error) {
                    console.error('Registration error:', error);
                    if (isNetworkError(error)) {
                        showNotification('Не удалось подключиться к серверу. Проверьте, что бэкенд запущен.', 'error');
                    } else {
                        showNotification('Не удалось выполнить регистрацию. Попробуйте позже.', 'error');
                    }
                } finally {
                    setTimeout(() => {
                        submitBtn.disabled = !consentCheckbox.checked;
                    }, 500);
                }
            });
        });
    </script>
</body>
</html>
