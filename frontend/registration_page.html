<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | TeamPal</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-placeholder.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

<style>

.page {
    height: 100vh;
    color: #2d3e56;
}

body {
  font-family: "Gabriela", serif;
  font-weight: 400;
  font-style: normal;
  margin: 0;
  background-color: #fffffc;
}

/* Класс для другого шрифта - применяем его к заголовку */
.different-font {
  font-family: "Space Grotesk", sans-serif;
  font-optical-sizing: auto;
  font-weight: 700;
  font-style: normal;
}

.form {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.wrapper {
    width: 33%;
    border: 1px solid #0000001a;
    border-radius: 10px;
    padding-left: 20px;
}


/* перепроверить ещё раз */
.wrapper .subtitle, .wrapper button {
    text-align: center;
    color: #2d3e56;
    font-family: "Gabriela", serif

}

.wrapper h1 {
    font-size: 42px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 5px;
}

/* Стили для табов - под заголовком */
.auth-tabs {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 20px;
}

.auth-tab {
    font-size: 15px;
    font-weight: 500;
    padding: 5px 0;
    cursor: pointer;
    color: #b5b5b5;
    text-decoration: none;
    position: relative;
    transition: color 0.3s;
    letter-spacing: 0.3px;
}

.auth-tab:hover {
    color: #F85A0B;
}

.auth-tab.active {
    color: #F85A0B;
}

.auth-tab.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: #F85A0B;
    border-radius: 2px;
}

.wrapper p {
    font-size: 16px;
    font-weight: 400;
    color: #b5b5b5;
    padding-bottom: 15px;
    text-align: center;
    margin-top: 0;
}

.login_wrapper label {
    font-size: 16px;
    font-weight: 500;

}

.login_wrapper {
    padding-bottom: 27px;
}

.password_wrapper label {
    font-size: 16px;
    font-weight: 500;
}

.password_wrapper {
    padding-bottom: 20px;
}

.consent_wrapper {
    margin-bottom: 20px;
    padding-right: 20px;
}

.consent-checkbox {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.consent-checkbox input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 3px;
    flex-shrink: 0;
}

.consent-text {
    font-size: 14px;
    line-height: 1.4;
    color: #555;
}

.consent-text a {
    color: #F85A0B;
    text-decoration: none;
}

.consent-text a:hover {
    text-decoration: underline;
}

input {
    font-size: 16px;
    font-weight: 400;
    background-color: #f5f5f5;
    border: none;
    border-radius: 7px;
    padding-left: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    width: 94%;
    margin-top: 10px;
    text-align: left;
    box-sizing: border-box;
}

input::placeholder {
    color: #808289;
}

input:focus {
    color: #212529;
    outline: 0;
    box-shadow: 0 0 0 3px #9c9c9c;
    transition: 0.2s;
}

.login_button {
    background-color: #F85A0B;
    margin-right: 20px;
    margin-bottom: 10px;
    border-radius: 10px;
}

button {
    padding-top: 10px;
    padding-bottom: 10px;
    color: white;
    background-color: black;
    margin-right: 20px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-style: none;
    text-align: center;
    width: 94%;
}

.login_button:hover {
    cursor: pointer;
}

.login_button:active {
    background-color: #575757;
}

.login_button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}

</style>
</head>
<body class="page">
    <form class="form" action="" method="post">
        <div class="wrapper">
            <h1 class="title different-font">TeamPal</h1>
            
            <!-- Табы под заголовком, меньшего размера -->
            <div class="auth-tabs">
                <a href="#" class="auth-tab" id="loginTab">Войти</a>
                <a href="#" class="auth-tab active" id="registerTab">Зарегистрироваться</a>
            </div>
            
            <p class="subtitle">Введите ваши данные для регистрации</p>
            <div class="login_wrapper">
                <label for="email">Логин</label>
                <div class="login_input">
                    <input type="email" id="email" name="email" placeholder="Введите почту" required>
                </div>
            </div>
            <div class="password_wrapper">
                <label for="password">Пароль</label>
                <div class="password_input">
                    <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
                </div>
            </div>
            <div class="consent_wrapper">
                <div class="consent-checkbox">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent" class="consent-text">
                        Я даю согласие на обработку моих персональных данных в соответствии с 
                        <a href="#" target="_blank">Политикой конфиденциальности</a>
                    </label>
                </div>
            </div>
            <button class="login_button" type="submit" id="submitBtn">Зарегистрироваться</button>
        </div>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const consentCheckbox = document.getElementById('consent');
            const submitBtn = document.getElementById('submitBtn');
            
            // Изначально кнопка неактивна
            submitBtn.disabled = true;
            
            // Активация кнопки при согласии
            consentCheckbox.addEventListener('change', function() {
                submitBtn.disabled = !this.checked;
            });
            
            // Обработчики для табов
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const subtitle = document.querySelector('.subtitle');
            const consentWrapper = document.querySelector('.consent_wrapper');
            const submitButton = document.getElementById('submitBtn');
            
            loginTab.addEventListener('click', function(e) {
                e.preventDefault();
                
                loginTab.classList.remove('active');
                registerTab.classList.remove('active');
                this.classList.add('active');
                
                subtitle.textContent = 'Введите ваши данные для входа';
                consentWrapper.style.display = 'none';
                submitButton.textContent = 'Войти';
                document.getElementById('consent').required = false;
                submitBtn.disabled = false;
            });
            
            registerTab.addEventListener('click', function(e) {
                e.preventDefault();
                
                loginTab.classList.remove('active');
                registerTab.classList.remove('active');
                this.classList.add('active');
                
                subtitle.textContent = 'Введите ваши данные для регистрации';
                consentWrapper.style.display = 'block';
                submitButton.textContent = 'Зарегистрироваться';
                document.getElementById('consent').required = true;
                submitBtn.disabled = !document.getElementById('consent').checked;
            });
        });
    </script>
</body>
</html>
