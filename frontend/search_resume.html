<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск резюме | TeamPal</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2;
      --header: #eae8e4;
      --panel: #ffffff;
      --panel-soft: #fffaf3;
      --ink: #1a1a1a;
      --ink2: #3a3a3a;
      --line: rgba(0, 0, 0, 0.09);
      --accent-1: #fa9500;
      --accent-2: #f85a0b;
      --accent-3: #eb6424;
      --footer: #d4d3cb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      background: radial-gradient(900px 500px at -10% -25%, rgba(255, 208, 102, 0.28), transparent 70%),
                  radial-gradient(700px 420px at 110% 0%, rgba(248, 90, 11, 0.14), transparent 68%),
                  var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .notification-container {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: auto;
      min-width: 280px;
      max-width: 500px;
      pointer-events: none;
    }

    .notification {
      background: #ffffff;
      border-radius: 8px;
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      animation: fadeInDown 0.25s ease-out;
      pointer-events: auto;
      border: 1px solid #0000001a;
      width: 100%;
    }

    @keyframes fadeInDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeOutUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-20px); opacity: 0; }
    }

    .notification.error { border-left: 3px solid #2d3e56; }
    .notification.success { border-left: 3px solid #2d3e56; }
    .notification.warning { border-left: 3px solid #2d3e56; }

    .notification-content {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
      color: #2d3e56;
      font-family: "Gabriela", serif;
      text-align: center;
    }

    .notification-close {
      cursor: pointer;
      font-size: 18px;
      color: #b5b5b5;
      transition: color 0.2s;
      line-height: 1;
      flex-shrink: 0;
      font-family: "Gabriela", serif;
      user-select: none;
    }

    .notification-close:hover { color: #F85A0B; }

    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      height: 72px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }
    .header__inner {
      height: 100%;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .header__left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 46px; height: 46px; border-radius: 50px; object-fit: cover; }
    .header__actions { display: flex; align-items: center; gap: 12px; position: relative; }
    .role-toggle {
      display: flex;
      background: #f0ece7;
      border-radius: 999px;
      padding: 3px;
      border: 1px solid var(--line);
    }
    .role-toggle__btn {
      padding: 8px 18px;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #7a7060;
      transition: all 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .role-toggle__btn:hover { color: var(--ink); }
    .role-toggle__btn.active {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      box-shadow: 0 2px 8px rgba(248, 90, 11, 0.25);
    }
    .notify-btn {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .notify-btn:hover {
      background: linear-gradient(135deg, #fff5e8, #ffffff);
      border-color: rgba(248, 90, 11, 0.55);
      box-shadow: 0 8px 18px rgba(250, 149, 0, 0.18);
    }
    .notify-btn svg { width: 22px; height: 22px; display: block; }
    .burger {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .burger:hover {
      background: linear-gradient(135deg, #fff9f0, #ffffff);
      border-color: var(--accent-2);
      box-shadow: 0 4px 12px rgba(248, 90, 11, 0.15);
      transform: scale(0.98);
    }
    .burger span {
      width: 22px;
      height: 2.5px;
      background: linear-gradient(90deg, #5a4a3a, #3a2a1a);
      display: block;
      border-radius: 4px;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform-origin: center;
    }
    .burger.open span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); width: 24px; background: linear-gradient(90deg, var(--accent-2), var(--accent-1)); }
    .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger.open span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); width: 24px; background: linear-gradient(90deg, var(--accent-2), var(--accent-1)); }
    .burger.open {
      border-color: var(--accent-2);
      background: linear-gradient(135deg, #fff5e8, #ffffff);
      box-shadow: 0 6px 16px rgba(248, 90, 11, 0.2);
    }
    .header-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 12px);
      width: 244px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px 8px;
      display: none;
      animation: menuFadeIn 0.2s ease;
    }
    @keyframes menuFadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .header-menu.open { display: block; }
    .header-menu__title { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; color: #8b8b8b; margin-bottom: 12px; padding: 0 10px; }
    .header-menu__item, .header-menu__exit {
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 14px;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      color: var(--ink);
      font-family: inherit;
    }
    .header-menu__item:hover { background: linear-gradient(95deg, #fff5e8, #fffbf5); color: var(--accent-2); transform: translateX(4px); }
    .header-menu__exit { margin-top: 8px; margin-bottom: 0; color: #d14b2a; border-top: 1px solid var(--line); border-radius: 0; padding-top: 12px; }
    .header-menu__exit:hover { background: #fff0ea; color: #c0391c; }

    .page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 102px 20px 26px;
      flex: 1;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }

    .top-title {
      font-size: 26px;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }

    .search-card {
      padding: 16px;
      background: linear-gradient(180deg, rgba(255, 208, 102, 0.16), transparent 38%), #fff;
      margin-bottom: 16px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      border: 2px solid #dfdfdf;
      border-radius: 999px;
      background: #fff;
      font-size: 14px;
      padding: 11px 14px;
      font-family: inherit;
    }
    .search-input:focus {
      outline: 2px solid rgba(248, 90, 11, 0.24);
      border-color: #f85a0b;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: linear-gradient(135deg, #fff5e8, #ffffff);
      border-color: rgba(248, 90, 11, 0.55);
      box-shadow: 0 8px 18px rgba(250, 149, 0, 0.18);
      transform: translateY(-1px);
    }
    .icon-btn svg { width: 22px; height: 22px; }

    .action-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #2e2e2e;
      padding: 11px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      height: 46px;
      white-space: nowrap;
    }
    .action-btn--accent {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(250, 149, 0, 0.22);
    }
    .action-btn--accent:hover { transform: scale(0.99); opacity: 0.96; }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #6a6a6a;
    }
    .search-pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .search-pager__stat {
      font-size: 13px;
      color: #666;
      min-width: 88px;
      text-align: center;
    }

    .vacancies {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .vacancy-card {
      padding: 12px 14px;
      background: #fff;
    }
    .vacancy-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      margin-bottom: 8px;
    }
    .vacancy-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-2);
      line-height: 1.2;
    }
    .vacancy-meta {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 6px 10px;
    }
    .meta-item {
      background: #faf9f7;
      border: 1px solid #ece9e5;
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
      color: #3a3a3a;
    }
    .meta-item b {
      color: #6a625b;
      font-weight: 600;
      margin-right: 4px;
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #efefef;
      color: #444;
      border: 1px solid #dfdfdf;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .vacancy-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .vacancy-actions .action-btn {
      border-radius: 12px;
      height: 40px;
      padding: 9px 16px;
    }

    .empty-state {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-soft);
      padding: 22px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }

    .footer {
      width: 100%;
      background: var(--footer);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 14px;
      color: var(--ink2);
      min-height: 52px;
      flex-wrap: wrap;
    }
    @media (max-width: 860px) {
      .footer { flex-direction: column; height: auto; padding: 12px 20px; gap: 4px; text-align: center; }
    }
    @media (max-width: 900px) {
      .vacancies { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .header__inner { padding: 0 16px; }
      .page { padding: 92px 14px 24px; }
      .role-toggle__btn { padding: 7px 14px; font-size: 12px; }
      .search-row { grid-template-columns: 1fr auto; }
      .action-btn--accent { grid-column: 1 / -1; }
    }
    @media (max-width: 768px) {
      .notification-container {
        top: 70px;
        width: 90%;
        max-width: 90%;
      }
      .notification { padding: 10px 16px; }
      .notification-content { font-size: 13px; }
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, 0.36);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
    }
    .modal.open { display: flex; }
    .modal__card {
      width: min(92vw, 520px);
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 18px;
      box-shadow: 0 24px 44px rgba(0, 0, 0, 0.2);
    }
    .modal__title { font-family: "Space Grotesk", sans-serif; font-size: 24px; margin-bottom: 12px; }
    .modal__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: #4c4c4c; font-weight: 500; }
    .field select, .field input {
      width: 100%;
      border: 2px solid #dfdfdf;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      padding: 10px 11px;
      font-family: inherit;
    }
    .field select:focus, .field input:focus {
      outline: 2px solid rgba(248, 90, 11, 0.24);
      border-color: #f85a0b;
    }
    .modal__actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .modal__actions .action-btn { border-radius: 12px; height: auto; }

    .modal__card--premium {
      width: min(92vw, 480px);
      border-radius: 22px;
      padding: 0;
      overflow: hidden;
      border: none;
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.18);
    }
    .modal__accent-strip {
      height: 5px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    }
    .modal__body { padding: 20px 22px 16px; }
    .modal__title-lg { font-size: 22px; font-weight: 700; margin: 0; color: var(--ink); letter-spacing: -0.02em; }
    .modal__subtitle { margin: 8px 0 0; font-size: 14px; color: #666; line-height: 1.45; }
    .modal__footer-bar {
      padding: 14px 22px 18px;
      background: linear-gradient(180deg, #faf9f7, #fff);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .vacancy-about-snippet {
      margin-top: 10px;
      font-size: 13px;
      color: #5c534c;
      line-height: 1.45;
      max-height: 4.6em;
      overflow: hidden;
    }
    .invite-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #faf9f7;
      font-size: 13px;
    }
    .invite-preview-grid div b {
      color: #6a625b;
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
  </style>
</head>
<body>
<div class="notification-container" id="notificationContainer"></div>
<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <img class="logo" src="./assets/logo.png" alt="Логотип TeamPal">
      <div class="role-toggle" id="role-toggle">
        <button class="role-toggle__btn" type="button" data-role="Ищу вакансию">Ищу вакансию</button>
        <button class="role-toggle__btn active" type="button" data-role="Ищу сотрудника">Ищу сотрудника</button>
      </div>
    </div>
    <div class="header__actions">
      <button class="notify-btn" type="button" aria-label="Отклики" onclick="window.location.href='./applications.html'">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 4a5 5 0 0 0-5 5v2.6c0 .7-.24 1.38-.68 1.9L5 15h14l-1.32-1.5a3 3 0 0 1-.68-1.9V9a5 5 0 0 0-5-5Z" stroke="#f85a0b" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10 18a2 2 0 0 0 4 0" stroke="#f85a0b" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="burger" id="burger-btn" type="button" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
      <nav class="header-menu" id="header-menu">
        <div class="header-menu__title">Меню</div>
        <button class="header-menu__item" type="button" data-nav="./account_manager.html">Личный кабинет</button>
        <button class="header-menu__item" type="button" data-nav="./search_resume.html">Поиск</button>
        <button class="header-menu__item" type="button" data-nav="./support_project.html">Поддержать проект</button>
        <button class="header-menu__exit" type="button" data-nav="./authorization_page.html">Выйти</button>
      </nav>
    </div>
  </div>
</header>

<main class="page">
  <h1 class="top-title">Поиск сотрудников</h1>

  <section class="card search-card" aria-label="Поиск резюме">
    <div class="search-row">
      <input class="search-input" id="q" type="text" placeholder="Введите должность, например: Frontend" autocomplete="off">
      <button class="icon-btn" id="open-filters" type="button" aria-label="Открыть фильтры">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="g" x1="4" y1="6" x2="20" y2="18" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f85a0b"/>
              <stop offset="1" stop-color="#fa9500"/>
            </linearGradient>
          </defs>
        </svg>
      </button>
      <button class="action-btn action-btn--accent" id="find" type="button">Найти</button>
    </div>
    <div class="hint">
      <span id="results-count">Найдено: 0</span>
    </div>
  </section>

  <section class="vacancies" id="vacancies" aria-label="Список резюме"></section>
  <div class="search-pager" id="search-pager" role="navigation" aria-label="Страницы результатов">
    <button type="button" class="action-btn" id="pager-prev">Назад</button>
    <span class="search-pager__stat" id="pager-status"></span>
    <button type="button" class="action-btn action-btn--accent" id="pager-next">Дальше</button>
  </div>
</main>

<footer class="footer">
  <span>TeamPal<span id="year"></span></span>
  <span>обратная связь: teampal@dimple.ru</span>
</footer>

<div class="modal" id="filters-modal" aria-hidden="true">
  <div class="modal__card modal__card--premium" role="dialog" aria-modal="true" aria-label="Фильтры резюме">
    <div class="modal__accent-strip"></div>
    <div class="modal__body">
      <h2 class="modal__title-lg">Фильтры</h2>
      <p class="modal__subtitle">Уточните параметры поиска резюме.</p>
      <div class="modal__grid" style="margin-top:14px;">
        <div class="field">
          <label for="f-city">Город кандидата</label>
          <select id="f-city">
            <option value="">Любой</option>
          </select>
        </div>
        <div class="field">
          <label for="f-skill">Навык из каталога</label>
          <select id="f-skill">
            <option value="">Любой</option>
          </select>
        </div>
        <div class="field">
          <label for="f-salary-min">Заработная плата от (в рублях)</label>
          <input id="f-salary-min" type="text" inputmode="numeric" autocomplete="off" placeholder="например 150 000">
        </div>
        <div class="field">
          <label for="f-salary-max">Заработная плата до (в рублях)</label>
          <input id="f-salary-max" type="text" inputmode="numeric" autocomplete="off" placeholder="не задано">
        </div>
        <div class="field">
          <label for="f-computed-exp">Уровень опыта (по резюме)</label>
          <select id="f-computed-exp">
            <option value="">Любой</option>
            <option value="none">Без опыта</option>
            <option value="<1">До 1 года</option>
            <option value="1-3">1–3 года</option>
            <option value="3-6">3–6 лет</option>
            <option value="6+">6+ лет</option>
          </select>
        </div>
        <div class="field">
          <label for="f-exp">Дополнительно: наличие опыта в тексте</label>
          <select id="f-exp">
            <option value="any">Любой</option>
            <option value="need">С указанным опытом работы</option>
            <option value="no">Без опыта работы</option>
          </select>
        </div>
        <div class="field">
          <label for="f-type">Тип резюме</label>
          <select id="f-type">
            <option value="any">Любой</option>
            <option value="commercial">Коммерческий проект</option>
            <option value="noncommercial">Учебный проект</option>
          </select>
        </div>
        <div class="field">
          <label for="f-commitment-level">Занятость</label>
          <select id="f-commitment-level">
            <option value="">Любая</option>
            <option value="full_time">Полный день</option>
            <option value="part_time">Неполный день</option>
            <option value="side_project">Подработка / гибкий формат</option>
          </select>
        </div>
        <div class="field">
          <label for="f-created-within">Дата создания резюме</label>
          <select id="f-created-within">
            <option value="">За всё время</option>
            <option value="7">За последние 7 дней</option>
            <option value="14">За последние 14 дней</option>
            <option value="30">За последние 30 дней</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal__footer-bar">
      <button class="action-btn" id="filters-reset" type="button">Сбросить</button>
      <button class="action-btn action-btn--accent" id="filters-apply" type="button">Применить</button>
    </div>
  </div>
</div>

<div class="modal" id="invite-modal" aria-hidden="true">
  <div class="modal__card modal__card--premium" role="dialog" aria-modal="true" aria-label="Пригласить кандидата">
    <div class="modal__accent-strip"></div>
    <div class="modal__body">
      <h2 class="modal__title-lg">Пригласить кандидата</h2>
      <p id="invite-resume-label" class="modal__subtitle"></p>
      <div id="invite-resume-preview" class="invite-preview-grid"></div>
      <div class="field">
        <label for="invite-vacancy-select">Выберите свою вакансию</label>
        <select id="invite-vacancy-select"></select>
      </div>
      <div id="invite-no-vacancies" style="display:none;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff8e6;border:1px solid #ffe082;color:#6d4c41;font-size:13px;line-height:1.45;">
        Нет свободных слотов в активных проектах. Создайте вакансию в проекте или верните проект со статуса паузы.
      </div>
    </div>

      <button class="action-btn" id="invite-cancel" type="button">Отмена</button>
      <button class="action-btn action-btn--accent" id="invite-confirm" type="button">Отправить приглашение</button>
    </div>
  </div>
</div>

<script src="./config.js"></script>
<script>
  (function () {
    const notificationContainer = document.getElementById("notificationContainer");

    function showNotification(message, type = "success", duration = 3500) {
      if (!notificationContainer) return;
      const notification = document.createElement("div");
      notification.className = `notification ${type}`;
      notification.innerHTML = `
        <div class="notification-content">${message}</div>
        <div class="notification-close">×</div>
      `;

      notificationContainer.appendChild(notification);
      const closeBtn = notification.querySelector(".notification-close");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          notification.style.animation = "fadeOutUp 0.25s ease-out forwards";
          setTimeout(() => notification.remove(), 250);
        });
      }

      setTimeout(() => {
        if (notification.parentElement) {
          notification.style.animation = "fadeOutUp 0.25s ease-out forwards";
          setTimeout(() => notification.remove(), 250);
        }
      }, duration);
    }

    const yearSpan = document.getElementById("year");
    if (yearSpan) yearSpan.textContent = " " + new Date().getFullYear();

    const roleToggle = document.getElementById("role-toggle");
    const burgerBtn = document.getElementById("burger-btn");
    const headerMenu = document.getElementById("header-menu");

    function closeMenus() {
      if (headerMenu) headerMenu.classList.remove("open");
      if (burgerBtn) burgerBtn.classList.remove("open");
    }

    if (roleToggle) {
      roleToggle.addEventListener("click", function (event) {
        const btn = event.target.closest(".role-toggle__btn");
        if (!btn) return;
        const role = btn.dataset.role || "Ищу сотрудника";
        try { localStorage.setItem("tp_role", role); } catch (_) {}
        roleToggle.querySelectorAll(".role-toggle__btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        if (role === "Ищу вакансию") window.location.href = "./search_project.html";
      });
    }

    if (burgerBtn && headerMenu) {
      burgerBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        this.classList.toggle("open");
        headerMenu.classList.toggle("open");
      });
    }

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".header__actions")) closeMenus();
    });

    document.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const href = btn.getAttribute("data-nav");
        if (href) window.location.href = href;
      });
    });

    try {
      const savedRole = localStorage.getItem("tp_role");
      if (savedRole && roleToggle) {
        roleToggle.querySelectorAll(".role-toggle__btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.role === savedRole);
        });
      }
      if (savedRole === "Ищу вакансию") {
        window.location.replace("./search_project.html");
        return;
      }
    } catch (_) {}


    let vacanciesList = [];
    let _citiesMap = {};
    let _skillsMap = {};

    const qInput = document.getElementById("q");
    const findBtn = document.getElementById("find");
    const listEl = document.getElementById("vacancies");
    const countEl = document.getElementById("results-count");

    const filtersModal = document.getElementById("filters-modal");
    const openFiltersBtn = document.getElementById("open-filters");
    const applyFiltersBtn = document.getElementById("filters-apply");
    const resetFiltersBtn = document.getElementById("filters-reset");
    const expSelect = document.getElementById("f-exp");
    const typeSelect = document.getElementById("f-type");

    const inviteModal = document.getElementById("invite-modal");
    const inviteVacancySelect = document.getElementById("invite-vacancy-select");
    const inviteResumeLabel = document.getElementById("invite-resume-label");
    const inviteNoVacancies = document.getElementById("invite-no-vacancies");
    const inviteCancelBtn = document.getElementById("invite-cancel");
    const inviteConfirmBtn = document.getElementById("invite-confirm");
    let inviteResumeNumericId = null;

    const state = {
      q: "",
      exp: "any",
      type: "any",
      city_id: "",
      skill_id: "",
      salary_min: "",
      salary_max: "",
      computed_exp: "",
      commitment_level: "",
      created_within_days: "",
      page: 1,
    };

    const RESUME_PAGE_SIZE = 15;
    let lastResumePageFetchCount = 0;

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
    }

    function formatSchedule(v) {
      return ({ "5/2": "5/2", "2/2": "2/2", "4/2": "4/2", "3/3": "3/3" })[v] || "—";
    }

    function intentLabel(intent) {
      return intent === "commercial" ? "Коммерческий" : intent === "noncommercial" ? "Учебный" : "—";
    }

    function resumeStatusLabel(st) {
      return st === "looking_for_job" ? "Ищу работу" : st === "not_looking_for_job" ? "Не ищу работу" : "—";
    }

    const EXP_BUCKET_LABELS = {
      none: "Без опыта",
      "<1": "До 1 года",
      "1-3": "1–3 года",
      "3-6": "3–6 лет",
      "6+": "6+ лет",
    };

    const COMMIT_LABELS_SR = { full_time: "Полный день", part_time: "Неполный день", side_project: "Подработка / гибкий формат" };
    const WORK_FMT_SR = { remote: "Удалённо", office: "В офисе", hybrid: "Гибрид" };
    const CONTRACT_LABELS_SR = { gph: "ГПХ", tk: "ТК РФ", internship: "Стажировка" };
    const CREATED_WITHIN_LABELS = { "7": "за 7 дн.", "14": "за 14 дн.", "30": "за 30 дн." };

    function salaryAmountPlain(value) {
      if (value === null || value === undefined || value === "") return "—";
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      return n.toLocaleString("ru-RU") + " ₽";
    }
    function salaryTypePlain(t) {
      return t === "per_project" ? "За проект" : (t === "monthly" ? "В месяц" : "—");
    }

    function skillsStackSummary(count) {
      const n = Number(count);
      if (!Number.isFinite(n) || n <= 0) return "—";
      return String(n);
    }

    function resumeFieldsHtml(item, layout) {
      const rows = [
        ["Желаемая должность", item.desiredPosition || "—"],
        ["Тип резюме", intentLabel(item.employmentIntent)],
        ["Статус поиска работы", resumeStatusLabel(item.status)],
        ["Опыт работы", EXP_BUCKET_LABELS[item.computedExp] || "—"],
        ["Формат работы", WORK_FMT_SR[item.workFormat] || "—"],
        ["Занятость", COMMIT_LABELS_SR[item.commitmentLevel] || "—"],
        ["График", formatSchedule(item.schedule)],
        ["Заработная плата (в рублях)", item.employmentIntent === "commercial" ? salaryAmountPlain(item.salaryAmount) : "—"],
        ["Тип зарплаты", item.employmentIntent === "commercial" ? salaryTypePlain(item.salaryType) : "—"],
        ["Тип договора", CONTRACT_LABELS_SR[item.contractType] || "—"],
        ["Стек технологий / Скиллы", skillsStackSummary(item.skillsCount)],
      ];
      if (layout === "modal") {
        return rows.map(([k, val]) => `<div><b>${escapeHtml(k)}</b>${escapeHtml(val)}</div>`).join("");
      }
      return rows.map(([k, val]) => `<div class="meta-item"><b>${escapeHtml(k)}:</b>${escapeHtml(val)}</div>`).join("");
    }

    function digitsGrouped(raw) {
      const d = String(raw || "").replace(/\D/g, "");
      if (!d) return "";
      return d.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }
    function bindGroupedSalary(id) {
      const el = document.getElementById(id);
      if (!el || el.dataset.tpGroupedBound) return;
      el.dataset.tpGroupedBound = "1";
      el.addEventListener("input", () => {
        const plain = el.value.replace(/\D/g, "");
        el.value = digitsGrouped(plain);
      });
      el.addEventListener("blur", () => {
        el.value = digitsGrouped(el.value.replace(/\D/g, ""));
      });
    }

    async function loadResumeFilterDicts() {
      try {
        const [citiesResp, skillsResp] = await Promise.all([
          fetch(API_BASE_URL + "/cities", { credentials: "include" }),
          fetch(API_BASE_URL + "/skills", { credentials: "include" }),
        ]);
        const citySel = document.getElementById("f-city");
        if (citySel) {
          citySel.innerHTML = '<option value="">Любой</option>';
          _citiesMap = {};
          if (citiesResp.ok) {
            const cities = await citiesResp.json();
            if (Array.isArray(cities)) {
              cities.forEach((c) => {
                if (c && c.id != null) {
                  _citiesMap[String(c.id)] = c.title || String(c.id);
                  const opt = document.createElement("option");
                  opt.value = String(c.id);
                  opt.textContent = c.title || String(c.id);
                  citySel.appendChild(opt);
                }
              });
            }
          }
        }
        const skillSel = document.getElementById("f-skill");
        if (skillSel) {
          skillSel.innerHTML = '<option value="">Любой</option>';
          _skillsMap = {};
          if (skillsResp.ok) {
            const skills = await skillsResp.json();
            if (Array.isArray(skills)) {
              skills.forEach((s) => {
                if (s && s.id != null) {
                  _skillsMap[String(s.id)] = s.name || String(s.id);
                  const opt = document.createElement("option");
                  opt.value = String(s.id);
                  opt.textContent = s.name || String(s.id);
                  skillSel.appendChild(opt);
                }
              });
            }
          }
        }
      } catch (_) {}
    }

    async function fetchResumesFromApi() {
      vacanciesList = [];
      lastResumePageFetchCount = 0;
      try {
        const params = new URLSearchParams();
        const expNeedClient = state.exp === "need";
        const perPage = expNeedClient ? 50 : RESUME_PAGE_SIZE;
        const pageNum = expNeedClient ? 1 : state.page;
        params.set("page", String(pageNum));
        params.set("per_page", String(perPage));
        const qt = (state.q || "").trim();
        if (qt) params.set("q", qt);
        if (state.type !== "any") params.set("employment_intent", state.type);
        if (state.city_id) params.set("city_id", state.city_id);
        if (state.skill_id) params.set("skill_id", state.skill_id);
        if (state.commitment_level) params.set("commitment_level", state.commitment_level);
        if (state.created_within_days) params.set("created_within_days", state.created_within_days);
        if (state.exp === "no") {
          params.set("computed_experience_level", "none");
        } else if (state.computed_exp) {
          params.set("computed_experience_level", state.computed_exp);
        }
        const sminRaw = state.salary_min != null ? String(state.salary_min).trim().replace(/\s/g, "") : "";
        const smaxRaw = state.salary_max != null ? String(state.salary_max).trim().replace(/\s/g, "") : "";
        const smin = sminRaw === "" ? NaN : parseInt(sminRaw, 10);
        const smax = smaxRaw === "" ? NaN : parseInt(smaxRaw, 10);
        if (Number.isFinite(smin) && smin >= 0) params.set("salary_min", String(smin));
        if (Number.isFinite(smax) && smax >= 0) params.set("salary_max", String(smax));

        const r = await fetch(API_BASE_URL + "/resumes?" + params.toString(), { credentials: "include" });
        if (!r.ok) return;
        const rows = await r.json();
        if (!Array.isArray(rows)) return;
        let mapped = rows.map((row) => ({
          id: String(row.id),
          userId: String(row.user_id),
          desiredPosition: row.desired_position || "",
          employmentIntent: row.employment_intent || "commercial",
          status: row.status || "",
          salaryAmount: row.salary_amount,
          salaryType: row.salary_type,
          schedule: row.schedule,
          commitmentLevel: row.commitment_level || "",
          workFormat: row.work_format || "",
          contractType: row.contract_type || "",
          computedExp: row.computed_experience_level || "",
          hasExperience: !!(row.computed_experience_level && row.computed_experience_level !== "none"),
          skillsCount: Number(row.skills_count) || 0,
          aboutSnippet: row.about_me ? String(row.about_me).replace(/\s+/g, " ").trim().slice(0, 220) : "",
        }));
        if (expNeedClient) {
          mapped = mapped.filter((x) => x.hasExperience);
        }
        vacanciesList = mapped;
        lastResumePageFetchCount = expNeedClient ? mapped.length : rows.length;
      } catch (_) {}
    }

    async function pollApplicationsBellBadge() {
      try {
        const resp = await fetch(API_BASE_URL + "/applications/badge_counts", { credentials: "include" });
        if (!resp.ok) return;
        const data = await resp.json();
        const count = Number(data.incoming_pending || 0);
        const notifyBtn = document.querySelector(".notify-btn");
        if (!notifyBtn) return;
        let badge = notifyBtn.querySelector(".notif-badge");
        if (count > 0) {
          if (!badge) {
            badge = document.createElement("span");
            badge.className = "notif-badge";
            badge.style.cssText = "position:absolute;top:-4px;right:-4px;background:#f85a0b;color:#fff;border-radius:50%;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;pointer-events:none;";
            notifyBtn.appendChild(badge);
          }
          badge.textContent = count > 99 ? "99+" : String(count);
        } else if (badge) {
          badge.remove();
        }
      } catch (_) {}
    }

    function closeInviteModal() {
      if (inviteModal) inviteModal.classList.remove("open");
      inviteResumeNumericId = null;
      const prevEl = document.getElementById("invite-resume-preview");
      if (prevEl) prevEl.innerHTML = "";
    }

    async function openInviteModal(resumeIdNum, item) {
      inviteResumeNumericId = resumeIdNum;
      const prevEl = document.getElementById("invite-resume-preview");
      if (inviteResumeLabel) inviteResumeLabel.textContent = item && item.desiredPosition ? item.desiredPosition : "";
      if (prevEl) prevEl.innerHTML = item ? resumeFieldsHtml(item, "modal") : "";
      if (inviteModal) inviteModal.classList.add("open");
      if (inviteVacancySelect) inviteVacancySelect.innerHTML = '<option value="">Загрузка…</option>';
      if (inviteNoVacancies) inviteNoVacancies.style.display = "none";
      try {
        const r = await fetch(API_BASE_URL + "/my_recruiting_vacancies", { credentials: "include" });
        if (r.status === 401) {
          showNotification("Войдите в аккаунт работодателя, чтобы отправить приглашение.", "warning", 4500);
          closeInviteModal();
          return;
        }
        if (!r.ok) {
          if (inviteVacancySelect) inviteVacancySelect.innerHTML = '<option value="">Ошибка загрузки</option>';
          return;
        }
        const opts = await r.json();
        if (!Array.isArray(opts) || opts.length === 0) {
          if (inviteVacancySelect) inviteVacancySelect.innerHTML = '<option value="">— нет свободных вакансий —</option>';
          if (inviteNoVacancies) inviteNoVacancies.style.display = "block";
          return;
        }
        if (inviteVacancySelect) {
          inviteVacancySelect.innerHTML =
            '<option value="">— выберите вакансию —</option>' +
            opts.map((o) => {
              const vid = Number(o.vacancy_id);
              const label = (o.project_title || "Проект") + " · " + (o.role_name || "Должность");
              return `<option value="${vid}">${escapeHtml(label)}</option>`;
            }).join("");
        }
      } catch (_) {
        if (inviteVacancySelect) inviteVacancySelect.innerHTML = '<option value="">Ошибка соединения</option>';
      }
    }

    if (inviteCancelBtn) inviteCancelBtn.addEventListener("click", closeInviteModal);
    if (inviteModal) {
      inviteModal.addEventListener("click", (e) => { if (e.target === inviteModal) closeInviteModal(); });
    }
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && inviteModal && inviteModal.classList.contains("open")) closeInviteModal();
    });

    if (inviteConfirmBtn) {
      inviteConfirmBtn.addEventListener("click", async () => {
        const vacancyId = inviteVacancySelect ? inviteVacancySelect.value : "";
        if (!vacancyId || inviteResumeNumericId == null) return;
        inviteConfirmBtn.disabled = true;
        try {
          const r = await fetch(API_BASE_URL + "/vacancies/" + encodeURIComponent(vacancyId) + "/invite_resume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ resume_id: inviteResumeNumericId }),
          });
          if (r.ok) {
            closeInviteModal();
            showNotification("Приглашение отправлено. Отклик появится у соискателя.", "success", 4000);
            pollApplicationsBellBadge();
          } else {
            const err = await r.json().catch(() => ({}));
            showNotification("Ошибка: " + (err.detail || "Не удалось отправить приглашение"), "error", 4500);
          }
        } catch (_) {
          showNotification("Ошибка соединения с сервером", "error", 4000);
        }
        inviteConfirmBtn.disabled = false;
      });
    }

    function render(list) {
      if (!listEl) return;
      if (!Array.isArray(list) || list.length === 0) {
        listEl.innerHTML = `<div class="empty-state">Ничего не найдено. Попробуйте изменить запрос или фильтры.</div>`;
        if (countEl) {
          countEl.textContent =
            state.exp !== "need" && state.page > 1 ? "На этой странице пусто — вернитесь назад" : "Найдено: 0";
        }
        return;
      }

      listEl.innerHTML = list.map((v) => {
        const aboutBlock = v.aboutSnippet
          ? `<div class="vacancy-about-snippet">${escapeHtml(v.aboutSnippet)}${v.aboutSnippet.length >= 220 ? "…" : ""}</div>`
          : "";
        return `
          <article class="card vacancy-card">
            <div class="vacancy-head">
              <div>
                <div class="vacancy-title">${escapeHtml(v.desiredPosition)}</div>
              </div>
              <div style="display:flex; justify-content:flex-end;">
                <span class="type-badge">${escapeHtml(intentLabel(v.employmentIntent))}</span>
              </div>
            </div>
            <div class="vacancy-meta">
              ${resumeFieldsHtml(v, "card")}
            </div>
            ${aboutBlock}
            <div class="vacancy-actions">
              <button class="action-btn" type="button" data-view="${escapeHtml(v.id)}" data-user="${escapeHtml(v.userId)}">Просмотреть резюме</button>
              <button class="action-btn action-btn--accent" type="button" data-invite="${escapeHtml(v.id)}">Откликнуться</button>
            </div>
          </article>
        `;
      }).join("");

      if (countEl) {
        if (state.exp === "need") {
          countEl.textContent = "Найдено: " + list.length + " (с опытом, до 50 с сервера)";
        } else {
          const hasMore = lastResumePageFetchCount >= RESUME_PAGE_SIZE;
          countEl.textContent = "Стр. " + state.page + " · карточек: " + list.length + (hasMore ? "" : " (конец)");
        }
      }

      listEl.querySelectorAll("[data-invite]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-invite");
          const item = vacanciesList.find((x) => x.id === id);
          const numId = id ? parseInt(id, 10) : NaN;
          if (!Number.isFinite(numId)) return;
          openInviteModal(numId, item || null);
        });
      });

      listEl.querySelectorAll("[data-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-view");
          const uid = btn.getAttribute("data-user");
          if (!id) return;
          let url = "./card_resume.html?id=" + encodeURIComponent(id);
          if (uid) url += "&user_id=" + encodeURIComponent(uid);
          window.location.href = url;
        });
      });
    }

    function updateResumePager() {
      const wrap = document.getElementById("search-pager");
      const prev = document.getElementById("pager-prev");
      const next = document.getElementById("pager-next");
      const stat = document.getElementById("pager-status");
      if (!wrap || !prev || !next || !stat) return;
      if (state.exp === "need") {
        wrap.hidden = true;
        return;
      }
      wrap.hidden = false;
      stat.textContent = "Страница " + state.page;
      prev.disabled = state.page <= 1;
      next.disabled = lastResumePageFetchCount < RESUME_PAGE_SIZE;
    }

    async function applySearch() {
      state.q = qInput ? qInput.value.trim() : "";
      state.page = 1;
      await fetchResumesFromApi();
      render(vacanciesList);
      updateResumePager();
    }

    function openFilters() {
      if (!filtersModal) return;
      const sync = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.value = val != null ? String(val) : "";
      };
      sync("f-city", state.city_id);
      sync("f-skill", state.skill_id);
      sync("f-salary-min", state.salary_min);
      sync("f-salary-max", state.salary_max);
      sync("f-computed-exp", state.computed_exp);
      sync("f-commitment-level", state.commitment_level);
      sync("f-created-within", state.created_within_days);
      if (expSelect) expSelect.value = state.exp;
      if (typeSelect) typeSelect.value = state.type;
      bindGroupedSalary("f-salary-min");
      bindGroupedSalary("f-salary-max");
      filtersModal.classList.add("open");
    }

    function closeFilters() {
      if (!filtersModal) return;
      filtersModal.classList.remove("open");
    }

    if (openFiltersBtn) openFiltersBtn.addEventListener("click", openFilters);
    if (filtersModal) {
      filtersModal.addEventListener("click", (event) => {
        if (event.target === filtersModal) closeFilters();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeFilters();
      });
    }

    if (applyFiltersBtn) {
      applyFiltersBtn.addEventListener("click", () => {
        state.city_id = document.getElementById("f-city") ? document.getElementById("f-city").value : "";
        state.skill_id = document.getElementById("f-skill") ? document.getElementById("f-skill").value : "";
        state.salary_min = document.getElementById("f-salary-min") ? document.getElementById("f-salary-min").value : "";
        state.salary_max = document.getElementById("f-salary-max") ? document.getElementById("f-salary-max").value : "";
        state.computed_exp = document.getElementById("f-computed-exp") ? document.getElementById("f-computed-exp").value : "";
        state.commitment_level = document.getElementById("f-commitment-level") ? document.getElementById("f-commitment-level").value : "";
        state.created_within_days = document.getElementById("f-created-within") ? document.getElementById("f-created-within").value : "";
        state.exp = expSelect ? expSelect.value : "any";
        state.type = typeSelect ? typeSelect.value : "any";
        closeFilters();
        applySearch();
      });
    }

    if (resetFiltersBtn) {
      resetFiltersBtn.addEventListener("click", () => {
        state.exp = "any";
        state.type = "any";
        state.city_id = "";
        state.skill_id = "";
        state.salary_min = "";
        state.salary_max = "";
        state.commitment_level = "";
        state.created_within_days = "";
        state.computed_exp = "";
        if (expSelect) expSelect.value = "any";
        if (typeSelect) typeSelect.value = "any";
        ["f-city", "f-skill", "f-salary-min", "f-salary-max", "f-computed-exp", "f-commitment-level", "f-created-within"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        closeFilters();
        applySearch();
      });
    }

    if (findBtn) findBtn.addEventListener("click", applySearch);
    if (qInput) {
      qInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          applySearch();
        }
      });
    }

    document.getElementById("pager-prev")?.addEventListener("click", async () => {
      if (state.page <= 1 || state.exp === "need") return;
      state.page -= 1;
      await fetchResumesFromApi();
      render(vacanciesList);
      updateResumePager();
    });
    document.getElementById("pager-next")?.addEventListener("click", async () => {
      if (state.exp === "need" || lastResumePageFetchCount < RESUME_PAGE_SIZE) return;
      state.page += 1;
      await fetchResumesFromApi();
      render(vacanciesList);
      updateResumePager();
    });

    void (async () => {
      await loadResumeFilterDicts();
      bindGroupedSalary("f-salary-min");
      bindGroupedSalary("f-salary-max");
      await fetchResumesFromApi();
      render(vacanciesList);
      updateResumePager();
      pollApplicationsBellBadge();
      setInterval(pollApplicationsBellBadge, 60000);
    })();
  })();
</script>
</body>
</html>
