<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование проекта | TeamPal</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2;
      --header: #eae8e4;
      --panel: #ffffff;
      --ink: #1a1a1a;
      --ink2: #3a3a3a;
      --line: rgba(0,0,0,0.09);
      --accent-1: #fa9500;
      --accent-2: #f85a0b;
      --footer: #d4d3cb;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:"Space Grotesk",system-ui,sans-serif;
      background: radial-gradient(900px 500px at -10% -25%, rgba(255,208,102,0.28), transparent 70%),
                  radial-gradient(700px 420px at 110% 0%,  rgba(248,90,11,0.14),  transparent 68%),
                  var(--bg);
      color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    }
    .header { position:fixed; inset:0 0 auto 0; z-index:1000; height:72px; background:var(--header); border-bottom:1px solid var(--line); }
    .header__inner { height:100%; padding:0 28px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .header__left { display:flex; align-items:center; gap:12px; }
    .logo { width:46px; height:46px; border-radius:50px; object-fit:cover; }
    .back-link {
      display:inline-flex; align-items:center; gap:6px;
      color:var(--ink2); font-size:14px; font-weight:500; text-decoration:none;
      padding:8px 14px; border-radius:999px; border:1px solid var(--line);
      background:#fff; transition:all .2s;
    }
    .back-link:hover { background:var(--bg); color:var(--accent-2); border-color:var(--accent-2); }
    .footer { width:100%; background:var(--footer); display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:14px; color:var(--ink2); min-height:52px; flex-wrap:wrap; }
    .page { width:100%; max-width:760px; margin:0 auto; padding:102px 20px 48px; flex:1; }
    .edit-card { background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:0 12px 30px rgba(0,0,0,0.06); padding:28px 28px; margin-bottom:20px; }
    .edit-title { font-size:26px; font-weight:700; margin-bottom:22px; }
    .edit-title span { color:var(--accent-2); }
    .section-title { font-size:17px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .vacancy-badge { background:#f0ece8; color:#7a6a5a; font-size:12px; font-weight:700; border-radius:20px; padding:2px 9px; }
    .field { display:flex; flex-direction:column; gap:5px; margin-bottom:16px; }
    .field label { font-size:13px; font-weight:600; color:#4c4c4c; }
    .field input, .field select, .field textarea {
      width:100%; border:1.5px solid #ddd; border-radius:12px;
      padding:11px 14px; font-family:inherit; font-size:15px; background:#fff;
      transition:border-color .2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline:2px solid rgba(248,90,11,.2); border-color:#f85a0b;
    }
    .field textarea { resize:vertical; min-height:100px; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .sep { border:none; border-top:1px solid var(--line); margin:20px 0; }
    .vacancy-card {
      border:1.5px solid var(--line); border-radius:14px; padding:18px 18px 16px;
      margin-bottom:14px; background:#fafaf8; position:relative;
    }
    .vacancy-card:last-child { margin-bottom:0; }
    .vacancy-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .vacancy-num { font-size:12px; color:#aaa; font-weight:700; white-space:nowrap; flex-shrink:0; }
    .vacancy-header select { flex:1; min-width:0; border:1.5px solid #ddd; border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px; background:#fff; }
    .vac-del-btn { padding:8px 14px; border-radius:10px; border:1px solid #f5c0b0; background:#fff0ee; color:#d14b2a; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; transition:all .2s; flex-shrink:0; }
    .vac-del-btn:hover:not(:disabled) { background:#ffe0da; }
    .vac-del-btn:disabled { opacity:.4; cursor:not-allowed; }
    .vac-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px; }
    .vac-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .vac-field { display:flex; flex-direction:column; gap:4px; }
    .vac-field label { font-size:12px; font-weight:600; color:#666; }
    .vac-field input, .vac-field select, .vac-field textarea {
      width:100%; border:1.5px solid #e0d8cf; border-radius:10px;
      padding:9px 11px; font-family:inherit; font-size:13px; background:#fff;
      transition:border-color .2s;
    }
    .vac-field input:focus, .vac-field select:focus, .vac-field textarea:focus {
      outline:2px solid rgba(248,90,11,.15); border-color:#f85a0b;
    }
    .vac-field textarea { resize:vertical; min-height:72px; }
    .btn-add-vac {
      width:100%; padding:13px; border-radius:14px; border:2px dashed #d4d0ca;
      background:transparent; font-size:14px; font-weight:600; color:#999;
      cursor:pointer; font-family:inherit; transition:all .2s; margin-top:10px;
    }
    .btn-add-vac:hover:not(:disabled) { border-color:var(--accent-1); color:var(--accent-1); background:rgba(250,149,0,0.04); }
    .btn-add-vac:disabled { opacity:.45; cursor:not-allowed; }

    .form-actions { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .form-actions__right { display:flex; gap:10px; }
    .btn { padding:11px 24px; border-radius:40px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; border:none; transition:all .2s; }
    .btn-secondary { background:#fff; border:1px solid #dbd2c7; color:#4a3a2a; }
    .btn-secondary:hover { background:#f5f0ea; }
    .btn-primary { background:linear-gradient(105deg,var(--accent-1),var(--accent-2)); color:#fff; box-shadow:0 4px 10px rgba(248,90,11,.25); }
    .btn-primary:hover:not(:disabled) { transform:translateY(-2px); opacity:.95; }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .btn-danger { background:#fff0ee; color:#d14b2a; border:1px solid #f5c0b0; }
    .btn-danger:hover { background:#ffe0da; color:#c0391c; }
    .loading-state { text-align:center; padding:60px 20px; color:#aaa; font-size:16px; }
    .field-error { font-size:12px; color:#c0391c; margin-top:2px; display:none; }
    .field-error.show { display:block; }
    .inp-invalid { border-color:#e05a2a !important; background:#fff8f7 !important; }
    .vac-err-msg { font-size:12px; color:#c0391c; background:#fff0ee; border:1px solid #f5c0b0; border-radius:8px; padding:6px 10px; margin-bottom:12px; display:none; }
    .vac-err-msg.show { display:flex; align-items:center; gap:6px; }
    .vac-err-msg::before { content:"⚠"; flex-shrink:0; }

    .toast-container { position:fixed; top:84px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:10px; width:min(440px,92vw); pointer-events:none; }
    .tp-toast { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.13); pointer-events:auto; animation:tpToastIn .3s ease; }
    .tp-toast.success { background:#f0fff4; border:1.5px solid #52c41a; }
    .tp-toast.error   { background:#fff2f0; border:1.5px solid #ff4d4f; }
    .tp-toast.warning { background:#fffbe6; border:1.5px solid #faad14; }
    .tp-toast.info    { background:#e6f7ff; border:1.5px solid #1890ff; }
    .tp-toast__icon { font-size:18px; line-height:1.2; flex-shrink:0; }
    .tp-toast.success .tp-toast__icon,.tp-toast.success .tp-toast__text,.tp-toast.success .tp-toast__close { color:#2d7a2d; }
    .tp-toast.error   .tp-toast__icon,.tp-toast.error   .tp-toast__text,.tp-toast.error   .tp-toast__close { color:#c0392b; }
    .tp-toast.warning .tp-toast__icon,.tp-toast.warning .tp-toast__text,.tp-toast.warning .tp-toast__close { color:#8b6914; }
    .tp-toast.info    .tp-toast__icon,.tp-toast.info    .tp-toast__text,.tp-toast.info    .tp-toast__close { color:#0958d9; }
    .tp-toast__text { flex:1; font-size:14px; line-height:1.45; white-space:pre-line; }
    .tp-toast__close { background:none; border:none; cursor:pointer; font-size:20px; line-height:1; padding:0; margin-left:2px; opacity:.75; }
    @keyframes tpToastIn  { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes tpToastOut { to{opacity:0;transform:translateY(-10px)} }

    .modal { position:fixed; inset:0; background:rgba(20,20,20,0.36); display:none; align-items:center; justify-content:center; z-index:1100; }
    .modal.open { display:flex; }
    .modal__card { width:min(92vw,440px); border-radius:16px; background:#fff; border:1px solid var(--line); padding:24px; box-shadow:0 24px 44px rgba(0,0,0,0.2); }
    .modal__title { font-size:22px; font-weight:700; margin-bottom:10px; }
    .modal__text { color:#555; font-size:14px; line-height:1.5; margin-bottom:18px; }
    .modal__actions { display:flex; justify-content:flex-end; gap:10px; }
    @media (max-width:640px) {
      .page { padding:92px 14px 36px; }
      .edit-card { padding:20px 16px; }
      .field-grid { grid-template-columns:1fr; }
      .vac-grid-3 { grid-template-columns:1fr 1fr; }
      .form-actions { flex-direction:column; align-items:stretch; }
      .form-actions__right { justify-content:flex-end; }
    }
    @media (max-width:400px) {
      .vac-grid-3 { grid-template-columns:1fr; }
      .vac-grid-2 { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<div class="modal" id="confirm-modal" aria-hidden="true">
  <div class="modal__card">
    <div class="modal__title" id="modal-title">Удалить проект?</div>
    <div class="modal__text" id="modal-text">Это действие необратимо. Проект будет удалён навсегда вместе со всеми вакансиями.</div>
    <div class="modal__actions">
      <button class="btn btn-secondary" id="confirm-cancel" type="button">Отмена</button>
      <button class="btn btn-danger" id="confirm-ok" type="button">Да, удалить</button>
    </div>
  </div>
</div>

<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <img class="logo" src="./assets/logo.png" alt="TeamPal">
      <a href="./account_manager.html" class="back-link">← Назад к проектам</a>
    </div>
  </div>
</header>

<main class="page">
  <div id="page-content">
    <div class="loading-state">Загрузка проекта…</div>
  </div>
</main>

<footer class="footer">
  <span>TeamPal<span id="year"></span></span>
  <span>обратная связь: teampal@dimple.ru</span>
</footer>

<script src="./config.js"></script>
<script>
(function () {
  'use strict';

  document.getElementById('year').textContent = ' ' + new Date().getFullYear();

  function showToast(message, type, duration) {
    duration = duration || 5000;
    type = type || 'success';
    var icons = { success:'✓', error:'✕', warning:'⚠', info:'ℹ' };
    var container = document.getElementById('toast-container');
    if (!container) return;
    var el = document.createElement('div');
    el.className = 'tp-toast ' + type;
    var msg = String(message || '').replace(/[&<>]/g, function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});
    el.innerHTML = '<span class="tp-toast__icon">'+(icons[type]||'ℹ')+'</span><span class="tp-toast__text">'+msg+'</span><button class="tp-toast__close" aria-label="Закрыть">×</button>';
    el.querySelector('.tp-toast__close').addEventListener('click', function(){ el.remove(); });
    container.appendChild(el);
    setTimeout(function(){
      if (el.parentElement) { el.style.animation='tpToastOut .25s ease forwards'; setTimeout(function(){el.remove();},260); }
    }, duration);
  }

  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"]/g, function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});
  }

  var params = new URLSearchParams(window.location.search);
  var projectId = params.get('id');

  if (!projectId) {
    document.getElementById('page-content').innerHTML = '<div class="loading-state">Проект не найден. <a href="./account_manager.html">← Назад</a></div>';
    return;
  }

  var INTENT_OPTS = [
    {value:'commercial',    label:'Коммерческий'},
    {value:'noncommercial', label:'Некоммерческий'},
  ];
  var STATUS_OPTS = [
    {value:'active', label:'Активен'},
    {value:'paused', label:'Приостановлен'},
  ];
  var EXPERIENCE_OPTS = [
    {value:'',    label:'— Не указан —'},
    {value:'none',label:'Без опыта'},
    {value:'<1',  label:'До 1 года'},
    {value:'1-3', label:'1–3 года'},
    {value:'3-6', label:'3–6 лет'},
    {value:'6+',  label:'6+ лет'},
  ];
  var WORK_FORMAT_OPTS = [
    {value:'',      label:'— Не указан —'},
    {value:'remote',label:'Удалённо'},
    {value:'office',label:'В офисе'},
    {value:'hybrid',label:'Гибрид'},
  ];
  var SCHEDULE_OPTS = [
    {value:'',    label:'— Не указан —'},
    {value:'5/2', label:'5/2'},
    {value:'2/2', label:'2/2'},
    {value:'4/2', label:'4/2'},
    {value:'3/3', label:'3/3'},
  ];
  var EMPLOYMENT_OPTS = [
    {value:'',           label:'— Не указана —'},
    {value:'full_time',  label:'Полная занятость'},
    {value:'part_time',  label:'Частичная занятость'},
    {value:'side_project',label:'Подработка'},
  ];
  var SALARY_TYPE_OPTS = [
    {value:'',           label:'— Не указан —'},
    {value:'monthly',    label:'В месяц'},
    {value:'per_project',label:'За проект'},
  ];
  var CONTRACT_OPTS = [
    {value:'',          label:'— Не указан —'},
    {value:'gph',       label:'ГПХ'},
    {value:'tk',        label:'ТК'},
    {value:'internship',label:'Стажировка'},
  ];

  var allRoles = [];
  var vacancyList = [];
  var vKeyCounter = 0;

  function buildSelect(cls, key, options, currentVal) {
    var attr = key != null ? ' data-key="'+key+'"' : '';
    var cur = String(currentVal == null ? '' : currentVal);
    var opts = options.map(function(o){
      return '<option value="'+esc(o.value)+'"'+(String(o.value)===cur?' selected':'')+'>'+esc(o.label)+'</option>';
    }).join('');
    return '<select class="'+cls+'"'+attr+'>'+opts+'</select>';
  }

  function buildRoleSelect(key, roleTypeId) {
    var roleOpts = [{value:'', label:'— Выберите роль —'}].concat(
      allRoles.map(function(r){ return {value:String(r.id), label:r.name}; })
    );
    return buildSelect('vac-role', key, roleOpts, roleTypeId != null ? String(roleTypeId) : '');
  }

  function getFieldVal(cls, key) {
    var el = document.querySelector('.'+cls+'[data-key="'+key+'"]');
    return el ? el.value : '';
  }

  function readVacancyFromDom(key) {
    var roleVal = getFieldVal('vac-role', key);
    var salRaw = getFieldVal('vac-salary', key);
    return {
      role_type_id:     roleVal ? parseInt(roleVal, 10) : null,
      work_format:      getFieldVal('vac-work-format',  key) || null,
      employment:       getFieldVal('vac-employment',   key) || null,
      experience:       getFieldVal('vac-experience',   key) || null,
      salary_amount:    salRaw !== '' && salRaw !== null ? parseInt(salRaw, 10) : null,
      salary_type:      getFieldVal('vac-salary-type',  key) || null,
      schedule:         getFieldVal('vac-schedule',     key) || null,
      responsibilities: getFieldVal('vac-responsibilities', key).trim() || null,
      requirements:     getFieldVal('vac-requirements',     key).trim() || null,
      contract_type:    getFieldVal('vac-contract',     key) || null,
    };
  }

  function syncVacancyStateFromDom() {
    vacancyList.forEach(function(v) {
      if (v._deleted) return;
      var vals = readVacancyFromDom(v._key);
      Object.assign(v, vals);
    });
  }

  function renderVacancyCard(v, num, totalActive) {
    var isLast = totalActive <= 1;
    return '<div class="vacancy-card" data-vkey="'+v._key+'">'
      + '<div class="vac-err-msg" id="vac-err-'+v._key+'"></div>'
      + '<div class="vacancy-header">'
      + '<span class="vacancy-num">Вакансия '+num+'</span>'
      + buildRoleSelect(v._key, v.role_type_id)
      + '<button class="vac-del-btn" data-vkey="'+v._key+'" type="button"'+(isLast?' disabled title="Нельзя удалить единственную вакансию"':'')+'>Удалить</button>'
      + '</div>'

      + '<div class="vac-grid-3">'
      + '<div class="vac-field"><label>Формат работы</label>'
      +   buildSelect('vac-work-format', v._key, WORK_FORMAT_OPTS, v.work_format)+'</div>'
      + '<div class="vac-field"><label>Занятость</label>'
      +   buildSelect('vac-employment', v._key, EMPLOYMENT_OPTS, v.employment)+'</div>'
      + '<div class="vac-field"><label>Опыт</label>'
      +   buildSelect('vac-experience', v._key, EXPERIENCE_OPTS, v.experience)+'</div>'
      + '</div>'

      + '<div class="vac-grid-3">'
      + '<div class="vac-field"><label>Зарплата</label>'
      +   '<input class="vac-salary" data-key="'+v._key+'" type="number" min="0" step="1000" placeholder="Не указана" value="'+(v.salary_amount != null ? v.salary_amount : '')+'"></div>'
      + '<div class="vac-field"><label>Тип зарплаты</label>'
      +   buildSelect('vac-salary-type', v._key, SALARY_TYPE_OPTS, v.salary_type)+'</div>'
      + '<div class="vac-field"><label>График</label>'
      +   buildSelect('vac-schedule', v._key, SCHEDULE_OPTS, v.schedule)+'</div>'
      + '</div>'

      + '<div class="vac-grid-2">'
      + '<div class="vac-field"><label>Обязанности</label>'
      +   '<textarea class="vac-responsibilities" data-key="'+v._key+'" placeholder="Что предстоит делать…">'+esc(v.responsibilities||'')+'</textarea></div>'
      + '<div class="vac-field"><label>Требования</label>'
      +   '<textarea class="vac-requirements" data-key="'+v._key+'" placeholder="Навыки, опыт…">'+esc(v.requirements||'')+'</textarea></div>'
      + '</div>'

      + '<div class="vac-field"><label>Тип договора</label>'
      +   buildSelect('vac-contract', v._key, CONTRACT_OPTS, v.contract_type)+'</div>'
      + '</div>';
  }

  function renderVacancySection() {
    var active = vacancyList.filter(function(v){ return !v._deleted; });
    var count = active.length;
    var atMax = count >= 10;
    var cards = active.map(function(v, i){
      return renderVacancyCard(v, i+1, count);
    }).join('');

    return '<div class="edit-card" id="card-vacancies">'
      + '<div class="section-title">Вакансии <span class="vacancy-badge">'+count+'/10</span></div>'
      + '<div id="vacancy-list">'+cards+'</div>'
      + '<button class="btn-add-vac" id="btn-add-vac" type="button"'+(atMax?' disabled':'')+'>'
      +   (atMax ? 'Достигнут лимит вакансий (10)' : '+ Добавить вакансию')
      + '</button>'
      + '</div>';
  }

  function refreshVacancySection() {
    syncVacancyStateFromDom();
    var card = document.getElementById('card-vacancies');
    if (!card) return;
    card.outerHTML = renderVacancySection();
    bindVacancyEvents();
  }

  function bindVacancyEvents() {
    document.querySelectorAll('.vac-role').forEach(function(sel) {
      sel.addEventListener('change', function() {
        sel.classList.remove('inp-invalid');
        var key = sel.getAttribute('data-key');
        var e = document.getElementById('vac-err-' + key);
        if (e) { e.textContent = ''; e.classList.remove('show'); }
      });
    });

    document.querySelectorAll('.vac-del-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var key = parseInt(btn.getAttribute('data-vkey'), 10);
        var active = vacancyList.filter(function(v){ return !v._deleted; });
        if (active.length <= 1) { showToast('Нельзя удалить единственную вакансию', 'warning'); return; }
        var v = vacancyList.find(function(x){ return x._key === key; });
        if (!v) return;
        syncVacancyStateFromDom();
        v._deleted = true;
        refreshVacancySection();
      });
    });

    var addBtn = document.getElementById('btn-add-vac');
    if (addBtn) {
      addBtn.addEventListener('click', function() {
        var active = vacancyList.filter(function(v){ return !v._deleted; });
        if (active.length >= 10) return;
        syncVacancyStateFromDom();
        vacancyList.push({
          _key: ++vKeyCounter,
          id: null,
          _isNew: true,
          _deleted: false,
          _original: null,
          role_type_id: null,
          work_format: null, employment: null, experience: null,
          salary_amount: null, salary_type: null, schedule: null,
          responsibilities: null, requirements: null, contract_type: null,
        });
        refreshVacancySection();
      });
    }
  }

  function renderPage(project, vacancies) {
    function selOpts(opts, cur) {
      return opts.map(function(o){
        return '<option value="'+esc(o.value)+'"'+(o.value===cur?' selected':'')+'>'+esc(o.label)+'</option>';
      }).join('');
    }

    document.getElementById('page-content').innerHTML =
      '<div class="edit-card">'
      + '<div class="edit-title">Редактирование <span>проекта</span></div>'

      + '<div class="field"><label for="f-title">Название проекта</label>'
      + '<input id="f-title" type="text" placeholder="Название проекта" maxlength="255" value="'+esc(project.title||'')+'">'
      + '<span class="field-error" id="err-title"></span></div>'

      + '<div class="field"><label for="f-description">Описание проекта</label>'
      + '<textarea id="f-description" placeholder="Краткое описание…">'+esc(project.description||'')+'</textarea></div>'

      + '<div class="field"><label for="f-tasks">Задачи / что предстоит делать</label>'
      + '<textarea id="f-tasks" style="min-height:88px;" placeholder="Что предстоит делать участникам…">'+esc(project.tasks||'')+'</textarea></div>'

      + '<div class="field-grid">'
      + '<div class="field" style="margin-bottom:0;"><label for="f-intent">Тип проекта</label>'
      + '<select id="f-intent">'+selOpts(INTENT_OPTS, project.employment_intent)+'</select></div>'
      + '<div class="field" style="margin-bottom:0;"><label for="f-status">Статус проекта</label>'
      + '<select id="f-status">'+selOpts(STATUS_OPTS, project.status)+'</select></div>'
      + '</div>'
      + '</div>'

      + renderVacancySection()

      + '<div class="edit-card">'
      + '<div class="form-actions">'
      + '<button class="btn btn-danger" id="btn-delete" type="button">Удалить проект</button>'
      + '<div class="form-actions__right">'
      + '<a href="./account_manager.html" class="btn btn-secondary">Отмена</a>'
      + '<button class="btn btn-primary" id="btn-save" type="button">Сохранить</button>'
      + '</div>'
      + '</div>'
      + '</div>';

    document.getElementById('btn-save').addEventListener('click', saveAll);

    var titleInput = document.getElementById('f-title');
    if (titleInput) {
      titleInput.addEventListener('input', function() {
        titleInput.classList.remove('inp-invalid');
        var e = document.getElementById('err-title');
        if (e) { e.textContent = ''; e.classList.remove('show'); }
      });
    }

    document.getElementById('btn-delete').addEventListener('click', function(){
      document.getElementById('modal-title').textContent = 'Удалить проект?';
      document.getElementById('modal-text').textContent = 'Это действие необратимо. Проект будет удалён навсегда вместе со всеми вакансиями.';
      document.getElementById('confirm-modal').classList.add('open');
    });

    bindVacancyEvents();
  }

  async function loadProject() {
    try {
      var authResp = await fetch(API_BASE_URL + '/auth/me', { credentials:'include' });
      if (!authResp.ok) { window.location.href = './authorization_page.html'; return; }
    } catch { window.location.href = './authorization_page.html'; return; }

    try {
      var [projResp, rolesResp] = await Promise.all([
        fetch(API_BASE_URL + '/my_project/' + projectId, { credentials:'include' }),
        fetch(API_BASE_URL + '/roles_dictionary',         { credentials:'include' }),
      ]);

      if (rolesResp.ok) {
        var rolesData = await rolesResp.json();
        allRoles = Array.isArray(rolesData) ? rolesData.filter(function(r){ return r.is_active !== false; }) : [];
      }

      var project, vacancies = [];

      if (!projResp.ok) {
        if (projResp.status === 404) {
          var errBody = await projResp.json().catch(function(){ return {}; });
          if (errBody.detail === 'У проекта нет вакансий') {
            showToast('У проекта нет вакансий — добавьте хотя бы одну', 'warning', 7000);
            project = { id: parseInt(projectId, 10), title:'', employment_intent:'commercial', status:'active', description:'', tasks:'' };
          } else {
            document.getElementById('page-content').innerHTML = '<div class="loading-state">Проект не найден. <a href="./account_manager.html">← Назад</a></div>';
            return;
          }
        } else {
          document.getElementById('page-content').innerHTML = '<div class="loading-state">Ошибка загрузки. <a href="./account_manager.html">← Назад</a></div>';
          return;
        }
      } else {
        var data = await projResp.json();
        project  = data.project || data;
        vacancies = data.vacancies || [];
      }

      vKeyCounter = 0;
      vacancyList = vacancies.map(function(v) {
        return {
          _key: ++vKeyCounter,
          id:   v.id,
          _isNew:   false,
          _deleted: false,
          _original: {
            role_type_id: v.role_type_id,
            work_format:  v.work_format,
            employment:   v.employment,
            experience:   v.experience,
            salary_amount:    v.salary_amount,
            salary_type:      v.salary_type,
            schedule:         v.schedule,
            responsibilities: v.responsibilities,
            requirements:     v.requirements,
            contract_type:    v.contract_type,
          },
          role_type_id: v.role_type_id,
          work_format:  v.work_format,
          employment:   v.employment,
          experience:   v.experience,
          salary_amount:    v.salary_amount,
          salary_type:      v.salary_type,
          schedule:         v.schedule,
          responsibilities: v.responsibilities,
          requirements:     v.requirements,
          contract_type:    v.contract_type,
        };
      });

      if (vacancyList.length === 0) {
        vacancyList.push({
          _key: ++vKeyCounter, id: null, _isNew: true, _deleted: false, _original: null,
          role_type_id: null, work_format: null, employment: null, experience: null,
          salary_amount: null, salary_type: null, schedule: null,
          responsibilities: null, requirements: null, contract_type: null,
        });
      }

      renderPage(project, vacancies);

    } catch (e) {
      console.error(e);
      document.getElementById('page-content').innerHTML = '<div class="loading-state">Ошибка соединения. <a href="./account_manager.html">← Назад</a></div>';
    }
  }

  async function saveAll() {
    var active = vacancyList.filter(function(v){ return !v._deleted; });

    document.querySelectorAll('.field-error').forEach(function(el){ el.textContent=''; el.classList.remove('show'); });
    document.querySelectorAll('.vac-err-msg').forEach(function(el){ el.textContent=''; el.classList.remove('show'); });
    document.querySelectorAll('.inp-invalid').forEach(function(el){ el.classList.remove('inp-invalid'); });

    var hasErrors = false;

    var title = document.getElementById('f-title').value.trim();
    if (!title) {
      var errTitle = document.getElementById('err-title');
      if (errTitle) { errTitle.textContent = 'Обязательное поле'; errTitle.classList.add('show'); }
      var titleInput = document.getElementById('f-title');
      if (titleInput) titleInput.classList.add('inp-invalid');
      hasErrors = true;
    }

    for (var i = 0; i < active.length; i++) {
      var vals = readVacancyFromDom(active[i]._key);
      if (!vals.role_type_id) {
        var vErr = document.getElementById('vac-err-' + active[i]._key);
        if (vErr) { vErr.textContent = 'Выберите роль для этой вакансии'; vErr.classList.add('show'); }
        var roleEl = document.querySelector('.vac-role[data-key="' + active[i]._key + '"]');
        if (roleEl) roleEl.classList.add('inp-invalid');
        hasErrors = true;
      }
    }

    if (hasErrors) {
      var firstErr = document.querySelector('.field-error.show, .vac-err-msg.show');
      if (firstErr) firstErr.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }

    var btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Сохранение…';

    var errors = [];

    var projPayload = {
      title: title,
      description: document.getElementById('f-description').value.trim() || null,
      tasks: document.getElementById('f-tasks').value.trim() || null,
      employment_intent: document.getElementById('f-intent').value,
      status: document.getElementById('f-status').value,
    };
    try {
      var pResp = await fetch(API_BASE_URL + '/projects/' + projectId, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        credentials: 'include',
        body: JSON.stringify(projPayload),
      });
      if (!pResp.ok) {
        var pErr = await pResp.json().catch(function(){ return {}; });
        errors.push('Проект: ' + (pErr.detail || 'ошибка сохранения'));
      }
    } catch { errors.push('Проект: ошибка соединения'); }

    if (errors.length > 0) {
      showToast(errors.join('\n'), 'error', 7000);
      btn.disabled = false; btn.textContent = 'Сохранить'; return;
    }

    var toDelete = vacancyList.filter(function(v){ return v._deleted && !v._isNew && v.id; });
    await Promise.all(toDelete.map(async function(v) {
      try {
        var r = await fetch(API_BASE_URL + '/projects/' + projectId + '/vacancies/' + v.id, {
          method:'DELETE', credentials:'include',
        });
        if (!r.ok && r.status !== 204) {
          var e = await r.json().catch(function(){ return {}; });
          errors.push('Удаление вакансии: ' + (e.detail || 'ошибка'));
        }
      } catch { errors.push('Удаление вакансии: ошибка соединения'); }
    }));

    var toAdd = active.filter(function(v){ return v._isNew; });
    await Promise.all(toAdd.map(async function(v) {
      var vals = readVacancyFromDom(v._key);
      var payload = buildVacancyPayload(vals);
      try {
        var r = await fetch(API_BASE_URL + '/projects/' + projectId + '/vacancies', {
          method:'POST',
          headers: {'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify(payload),
        });
        if (!r.ok) {
          var e = await r.json().catch(function(){ return {}; });
          errors.push('Создание вакансии: ' + (e.detail || 'ошибка'));
        }
      } catch { errors.push('Создание вакансии: ошибка соединения'); }
    }));

    var toUpdate = active.filter(function(v){ return !v._isNew && v.id; });
    await Promise.all(toUpdate.map(async function(v) {
      var vals = readVacancyFromDom(v._key);
      var orig = v._original || {};
      var changed = (
        vals.role_type_id !== orig.role_type_id ||
        vals.work_format  !== orig.work_format  ||
        vals.employment   !== orig.employment   ||
        vals.experience   !== orig.experience   ||
        vals.salary_amount !== orig.salary_amount ||
        vals.salary_type  !== orig.salary_type  ||
        vals.schedule     !== orig.schedule     ||
        (vals.responsibilities||'') !== (orig.responsibilities||'') ||
        (vals.requirements||'')     !== (orig.requirements||'')     ||
        vals.contract_type !== orig.contract_type
      );
      if (!changed) return;
      var payload = buildVacancyPayload(vals);
      try {
        var r = await fetch(API_BASE_URL + '/projects/' + projectId + '/vacancies/' + v.id, {
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify(payload),
        });
        if (!r.ok) {
          var e = await r.json().catch(function(){ return {}; });
          errors.push('Обновление вакансии: ' + (e.detail || 'ошибка'));
        }
      } catch { errors.push('Обновление вакансии: ошибка соединения'); }
    }));

    if (errors.length > 0) {
      showToast(errors.join('\n'), 'error', 8000);
      btn.disabled = false; btn.textContent = 'Сохранить';
    } else {
      showToast('Проект и вакансии сохранены', 'success');
      setTimeout(function(){ window.location.href = './account_manager.html'; }, 1400);
    }
  }

  function buildVacancyPayload(vals) {
    return {
      role_type_id:     vals.role_type_id,
      work_format:      vals.work_format      || null,
      employment:       vals.employment       || null,
      experience:       vals.experience       || null,
      salary_amount:    vals.salary_amount    != null ? vals.salary_amount : null,
      salary_type:      vals.salary_type      || null,
      schedule:         vals.schedule         || null,
      responsibilities: vals.responsibilities || null,
      requirements:     vals.requirements     || null,
      contract_type:    vals.contract_type    || null,
    };
  }

  document.getElementById('confirm-cancel').addEventListener('click', function(){
    document.getElementById('confirm-modal').classList.remove('open');
  });
  document.getElementById('confirm-ok').addEventListener('click', async function(){
    document.getElementById('confirm-modal').classList.remove('open');
    try {
      var r = await fetch(API_BASE_URL + '/projects/' + projectId, {
        method:'DELETE', credentials:'include',
      });
      if (r.ok || r.status === 204) {
        showToast('Проект удалён', 'success');
        setTimeout(function(){ window.location.href = './account_manager.html'; }, 1200);
      } else {
        var e = await r.json().catch(function(){ return {}; });
        showToast('Ошибка: ' + (e.detail || 'Не удалось удалить'), 'error');
      }
    } catch { showToast('Ошибка соединения с сервером', 'error'); }
  });
  document.getElementById('confirm-modal').addEventListener('click', function(e){
    if (e.target === document.getElementById('confirm-modal')) {
      document.getElementById('confirm-modal').classList.remove('open');
    }
  });

  loadProject();
})();
</script>
</body>
