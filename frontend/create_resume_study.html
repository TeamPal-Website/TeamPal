<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создание резюме | TeamPal</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2;
      --header: #eae8e4;
      --panel: #ffffff;
      --panel-soft: #fffaf3;
      --ink: #1a1a1a;
      --ink2: #3a3a3a;
      --line: rgba(0, 0, 0, 0.09);
      --accent-1: #fa9500;
      --accent-2: #f85a0b;
      --footer: #d4d3cb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", sans-serif;
      background: radial-gradient(900px 500px at -10% -25%, rgba(255, 208, 102, 0.28), transparent 70%),
                  radial-gradient(700px 420px at 110% 0%, rgba(248, 90, 11, 0.14), transparent 68%),
                  var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .notification-container {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: auto;
      min-width: 280px;
      max-width: 500px;
      pointer-events: none;
    }
    .notification {
      background: #ffffff;
      border-radius: 8px;
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      animation: fadeInDown 0.25s ease-out;
      pointer-events: auto;
      border: 1px solid #0000001a;
      width: 100%;
    }
    @keyframes fadeInDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeOutUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-20px); opacity: 0; }
    }
    .notification.error { border-left: 3px solid #2d3e56; }
    .notification.success { border-left: 3px solid #2d3e56; }
    .notification.warning { border-left: 3px solid #2d3e56; }
    .notification-content {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
      color: #2d3e56;
      font-family: "Space Grotesk", sans-serif;
      text-align: center;
    }
    .notification-close {
      cursor: pointer;
      font-size: 18px;
      color: #b5b5b5;
      transition: color 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }
    .notification-close:hover { color: #F85A0B; }

    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      height: 72px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }
    .header__inner {
      height: 100%;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .header__left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 46px; height: 46px; border-radius: 50px; object-fit: cover; }
    .header__actions { display: flex; align-items: center; gap: 12px; position: relative; }
    .role-select { position: relative; }
    .role-btn {
      min-width: 190px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
    }
    .role-btn::after { content: "▾"; float: right; color: #555; }
    .role-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      display: none;
    }
    .role-select.open .role-dropdown { display: block; }
    .role-dropdown button {
      width: 100%;
      border: 0;
      background: #fff;
      text-align: left;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
    }
    .role-dropdown button:hover { background: #fff7ec; }
    .burger {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .burger span {
      width: 22px;
      height: 2.5px;
      background: linear-gradient(90deg, #5a4a3a, #3a2a1a);
      display: block;
      border-radius: 4px;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .burger.open span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); width: 24px; background: linear-gradient(90deg, var(--accent-2), var(--accent-1)); }
    .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger.open span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); width: 24px; background: linear-gradient(90deg, var(--accent-2), var(--accent-1)); }
    .header-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 12px);
      width: 244px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px 8px;
      display: none;
    }
    .header-menu.open { display: block; }
    .header-menu__title {
      font-size: 12px;
      font-weight: 500;
      color: #8b8b8b;
      margin-bottom: 12px;
      padding: 0 10px;
      font-family: "Space Grotesk", sans-serif;
    }
    .header-menu__item, .header-menu__exit {
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 14px;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
    }
    .header-menu__item:hover { background: #fff5e8; color: var(--accent-2); }
    .header-menu__exit { margin-top: 8px; color: #d14b2a; border-top: 1px solid var(--line); border-radius: 0; padding-top: 12px; }
    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 102px 20px 26px;
      flex: 1;
    }
    .constructor-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .constructor-header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 500;
      color: var(--accent-2);
      cursor: pointer;
      text-decoration: none;
      font-family: "Space Grotesk", sans-serif;
      transition: transform 0.2s;
    }
    .back-link:hover { transform: translateX(-4px); color: #c13f0a; }
    .constructor-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-family: "Space Grotesk", sans-serif;
    }
    .constructor-body { padding: 28px; }
    .resume-section {
      background: var(--panel-soft);
      border-radius: 24px;
      padding: 20px 24px;
      margin-bottom: 28px;
      border: 1px solid var(--line);
      font-family: "Space Grotesk", sans-serif;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2d2a24;
      font-family: "Space Grotesk", sans-serif;
    }
    textarea, input, select {
      font-family: "Space Grotesk", sans-serif;
      border: 1px solid #e2dbd1;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      background: white;
      width: 100%;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(248, 90, 11, 0.1);
    }
    .skills-grid {
      font-family: "Space Grotesk", sans-serif;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px 16px;
      margin-bottom: 20px;
      max-height: 280px;
      overflow-y: auto;
      padding: 4px 6px;
    }
    .skill-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 8px 14px;
      border-radius: 40px;
      border: 1px solid #e8e0d5;
      cursor: pointer;
      transition: 0.2s;
      font-family: "Space Grotesk", sans-serif;
    }
    .skill-checkbox:hover { background: #fff7ef; border-color: var(--accent-1); }
    .skill-checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-2);
      margin: 0;
      cursor: pointer;
    }
    .skill-checkbox span {
      flex: 1;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #3a2e24;
      font-family: "Space Grotesk", sans-serif;
    }
    .selected-skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #e2d8ce;
    }
    .selected-skill-tag {
      background: linear-gradient(115deg, #fff0e0, #fff7ef);
      border-radius: 30px;
      padding: 5px 12px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--accent-2);
      font-family: "Space Grotesk", sans-serif;
    }
    .selected-skill-tag button {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #b78f64;
      font-family: "Space Grotesk", sans-serif;
    }
    .selected-skill-tag button:hover { color: var(--accent-2); }
    .experience-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 24px;
    }
    .exp-item {
      background: white;
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--line);
    }
    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #ece3d9;
    }
    .exp-company {
      font-weight: 700;
      font-size: 18px;
      color: var(--accent-2);
      font-family: "Space Grotesk", sans-serif;
    }
    .remove-exp {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #bc9a7a;
      font-family: "Space Grotesk", sans-serif;
    }
    .exp-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .exp-field-full { grid-column: span 2; }
    .field label {
      font-size: 13px;
      font-weight: 600;
      color: #4e3e2e;
      display: block;
      margin-bottom: 6px;
      font-family: "Space Grotesk", sans-serif;
    }
    .error-msg {
      font-size: 11px;
      color: #e05a2a;
      margin-top: 4px;
      font-family: "Space Grotesk", sans-serif;
    }
    .btn-add-exp {
      background: none;
      border: 1px dashed var(--accent-2);
      border-radius: 60px;
      padding: 12px;
      width: 100%;
      font-weight: 600;
      cursor: pointer;
      color: var(--accent-2);
      transition: 0.2s;
      font-family: "Space Grotesk", sans-serif;
    }
    .btn-add-exp:hover { background: #fff4ea; }
    .form-actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }
    .btn {
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      border: none;
    }
    .btn-secondary {
      background: #fff;
      border: 1px solid #dbd2c7;
      color: #4a3a2a;
    }
    .btn-secondary:hover { background: #f5f0ea; }
    .btn-primary {
      background: linear-gradient(105deg, var(--accent-1), var(--accent-2));
      color: white;
      box-shadow: 0 4px 10px rgba(248, 90, 11, 0.25);
    }
    .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; }
    .footer {
      width: 100%;
      background: var(--footer);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 14px;
      color: var(--ink2);
      min-height: 52px;
      flex-wrap: wrap;
      margin-top: 20px;
      font-family: "Space Grotesk", sans-serif;
    }
    @media (max-width: 760px) {
      .exp-fields { grid-template-columns: 1fr; }
      .exp-field-full { grid-column: span 1; }
      .constructor-header { flex-direction: column; align-items: flex-start; }
      .page { padding: 92px 16px 24px; }
      .skills-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="notification-container" id="notificationContainer"></div>

<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <img class="logo" src="./assets/logo.png" alt="TeamPal">
      <div class="role-select" id="role-select">
        <button class="role-btn" id="role-btn" type="button">Ищу вакансию</button>
        <div class="role-dropdown" id="role-dropdown">
          <button type="button" data-role="Ищу вакансию">Ищу вакансию</button>
          <button type="button" data-role="Ищу сотрудника">Ищу сотрудника</button>
        </div>
      </div>
    </div>
    <div class="header__actions">
      <button class="burger" id="burger-btn" type="button">
        <span></span><span></span><span></span>
      </button>
      <nav class="header-menu" id="header-menu">
        <div class="header-menu__title">Меню</div>
        <button class="header-menu__item" type="button">Личный кабинет</button>
        <button class="header-menu__item" type="button">Мои заявки</button>
        <button class="header-menu__item" type="button">Каталог</button>
        <button class="header-menu__item" type="button">Поддержать проект</button>
        <button class="header-menu__exit" type="button">Выйти</button>
      </nav>
    </div>
  </div>
</header>

<main class="page">
  <div class="constructor-card">
    <div class="constructor-header">
      <a href="javascript:history.back()" class="back-link">← Назад к резюме</a>
      <span class="constructor-title">Конструктор резюме</span>
    </div>
    <div class="constructor-body">
      <div class="resume-section">
        <div class="section-title">Основное</div>
        <div class="exp-fields">
          <div class="field exp-field-full">
            <label>Название резюме</label>
            <input id="resumeTitle" type="text" placeholder="Например: Frontend стажёр" />
          </div>
          <div class="field">
            <label>Должность</label>
            <input id="desiredPosition" type="text" placeholder="Frontend-разработчик" />
          </div>
          <div class="field">
            <label>График работы</label>
            <select id="workSchedule">
              <option value="">Выберите график</option>
              <option value="full_time">Полный день</option>
              <option value="part_time">Неполный день</option>
              <option value="flexible">Гибкий график</option>
              <option value="remote">Удалённо</option>
              <option value="hybrid">Гибрид</option>
            </select>
          </div>
        </div>
      </div>

      <div class="resume-section">
        <div class="section-title">О себе</div>
        <textarea id="aboutMe" rows="4" placeholder="Расскажите о вашем опыте, навыках и карьерных целях..."></textarea>
      </div>

      <div class="resume-section">
        <div class="section-title">Стек технологий / Скиллы</div>
        <div class="skills-grid" id="skillsGrid"></div>
        <div class="selected-skills-tags" id="selectedSkillsTags"></div>
        <small style="display: block; margin-top: 12px; color:#8f7e68;">✓ Отметьте галочками ваши навыки. Выбранные скиллы появятся выше — их можно убрать через крестик.</small>
      </div>

      <div class="resume-section">
        <div class="section-title">Опыт работы</div>
        <div id="experienceList" class="experience-list"></div>
        <button type="button" id="addExperienceBtn" class="btn-add-exp">+ Добавить место работы</button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Отменить</button>
        <button type="button" class="btn btn-primary" id="publishBtn">Опубликовать резюме</button>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <span>TeamPal<span id="year"></span></span>
  <span>обратная связь: teampal@dimple.ru</span>
</footer>


<script src="./config.js"></script>
<script>
  (function() {
    const notificationContainer = document.getElementById('notificationContainer');

    function showNotification(message, type = 'error', duration = 5000) {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `
        <div class="notification-content">${message}</div>
        <div class="notification-close">×</div>
      `;
      notificationContainer.appendChild(notification);
      const closeBtn = notification.querySelector('.notification-close');
      closeBtn.addEventListener('click', () => {
        notification.style.animation = 'fadeOutUp 0.25s ease-out forwards';
        setTimeout(() => { notification.remove(); }, 250);
      });
      setTimeout(() => {
        if (notification.parentElement) {
          notification.style.animation = 'fadeOutUp 0.25s ease-out forwards';
          setTimeout(() => { notification.remove(); }, 250);
        }
      }, duration);
    }

    const yearSpan = document.getElementById("year");
    if (yearSpan) yearSpan.textContent = " " + new Date().getFullYear();

    const allSkillsList = [
      "JavaScript", "TypeScript", "React", "Vue.js", "Angular", "Node.js", "Python", "Django", "Flask",
      "Java", "Spring Boot", "C#", ".NET", "Go", "PHP", "Laravel", "Ruby on Rails", "Swift", "Kotlin",
      "HTML5", "CSS3", "Sass/SCSS", "Tailwind CSS", "Figma", "Adobe XD", "UI/UX дизайн",
      "PostgreSQL", "MySQL", "MongoDB", "Redis", "GraphQL", "REST API", "Docker", "Kubernetes",
      "AWS", "Git", "CI/CD", "Jest", "Pytest", "Webpack", "Vite", "Аналитика данных"
    ].sort();

    let selectedSkills = [];
    const skillsGrid = document.getElementById("skillsGrid");
    const selectedTagsContainer = document.getElementById("selectedSkillsTags");

    function renderSkillsGrid() {
      if (!skillsGrid) return;
      skillsGrid.innerHTML = allSkillsList.map(skill => `
        <label class="skill-checkbox">
          <input type="checkbox" class="skill-check" value="${escapeHtml(skill)}" ${selectedSkills.includes(skill) ? 'checked' : ''}>
          <span>${escapeHtml(skill)}</span>
        </label>
      `).join('');
      document.querySelectorAll('.skill-check').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const skillValue = checkbox.value;
          if (checkbox.checked) {
            if (!selectedSkills.includes(skillValue)) selectedSkills.push(skillValue);
          } else {
            const idx = selectedSkills.indexOf(skillValue);
            if (idx !== -1) selectedSkills.splice(idx, 1);
          }
          renderSelectedTags();
        });
      });
    }

    function renderSelectedTags() {
      if (!selectedTagsContainer) return;
      if (selectedSkills.length === 0) {
        selectedTagsContainer.innerHTML = '<div style="color:#aaa; font-size:13px; font-family:\'Space Grotesk\', sans-serif;">Выберите навыки из списка выше</div>';
        return;
      }
      selectedTagsContainer.innerHTML = selectedSkills.map((skill, idx) => `
        <div class="selected-skill-tag">
          ${escapeHtml(skill)}
          <button type="button" data-skill-remove="${idx}">✕</button>
        </div>
      `).join('');
      document.querySelectorAll('[data-skill-remove]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(btn.getAttribute('data-skill-remove'));
          if (!isNaN(idx) && selectedSkills[idx]) {
            const removed = selectedSkills[idx];
            selectedSkills.splice(idx, 1);
            const checkboxToUncheck = Array.from(document.querySelectorAll('.skill-check')).find(cb => cb.value === removed);
            if (checkboxToUncheck) checkboxToUncheck.checked = false;
            renderSelectedTags();
          }
        });
      });
    }

    let experiences = [];
    const experienceListDiv = document.getElementById("experienceList");
    const addExpBtn = document.getElementById("addExperienceBtn");

    function isValidDateString(dateStr) {
      if (!dateStr.trim()) return true;
      let day, month, year;
      if (dateStr.includes('-')) {
        let parts = dateStr.split('-');
        if (parts.length !== 3) return false;
        year = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10);
        day = parseInt(parts[2], 10);
      } else if (dateStr.includes('.')) {
        let parts = dateStr.split('.');
        if (parts.length !== 3) return false;
        day = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10);
        year = parseInt(parts[2], 10);
      } else {
        return false;
      }
      if (isNaN(year) || isNaN(month) || isNaN(day)) return false;
      if (month < 1 || month > 12) return false;
      const daysInMonth = new Date(year, month, 0).getDate();
      if (day < 1 || day > daysInMonth) return false;
      if (year < 1900 || year > 2100) return false;
      return true;
    }

    function isValidEndDateString(dateStr) {
      const v = (dateStr || "").trim();
      if (!v) return true;
      if (isValidDateString(v)) return true;
      // allow words like "до сих пор", "по настоящее время"
      return /[A-Za-zА-Яа-яЁё]/.test(v);
    }

    function renderExperiences() {
      if (!experienceListDiv) return;
      if (experiences.length === 0) {
        experienceListDiv.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px; font-family:\'Space Grotesk\', sans-serif;">Нет добавленного опыта. Нажмите «+ Добавить место работы»</div>';
        return;
      }
      experienceListDiv.innerHTML = experiences.map((exp, idx) => `
        <div class="exp-item" data-exp-idx="${idx}">
          <div class="exp-header">
            <span class="exp-company">${escapeHtml(exp.company || 'Название компании')}</span>
            <button type="button" class="remove-exp" data-remove-exp="${idx}">✕ Удалить</button>
          </div>
          <div class="exp-fields">
            <div class="field"><label>Компания</label><input type="text" class="exp-company-input" value="${escapeHtml(exp.company)}" placeholder="Название компании (ООО, ...)"></div>
            <div class="field"><label>Должность / специальность</label><input type="text" class="exp-position-input" value="${escapeHtml(exp.position)}" placeholder="Frontend-разработчик"></div>
            <div class="field"><label>Дата прихода</label><input type="text" class="exp-start-input" value="${escapeHtml(exp.dateStart)}" placeholder="01.09.2022 или 2022-09-01"><div class="error-msg start-error" style="display:none;">Неверный формат даты</div></div>
            <div class="field"><label>Дата ухода</label><input type="text" class="exp-end-input" value="${escapeHtml(exp.dateEnd)}" placeholder="01.04.2025 / 2025-04-01 или «до сих пор»"><div class="error-msg end-error" style="display:none;">Введите дату или текст (например, «до сих пор»)</div></div>
            <div class="exp-field-full"><label>Описание</label><textarea rows="2" class="exp-desc-input" placeholder="Чем занимались, результаты...">${escapeHtml(exp.description)}</textarea></div>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('.remove-exp').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = btn.getAttribute('data-remove-exp');
          if (idx !== null) { experiences.splice(parseInt(idx), 1); renderExperiences(); }
        });
      });
      document.querySelectorAll('.exp-item').forEach((item, idx) => {
        const companyInput = item.querySelector('.exp-company-input');
        const positionInput = item.querySelector('.exp-position-input');
        const startInput = item.querySelector('.exp-start-input');
        const endInput = item.querySelector('.exp-end-input');
        const descInput = item.querySelector('.exp-desc-input');
        const startError = item.querySelector('.start-error');
        const endError = item.querySelector('.end-error');
        function updateExpData() {
          if (experiences[idx]) {
            experiences[idx].company = companyInput.value;
            experiences[idx].position = positionInput.value;
            experiences[idx].description = descInput.value;
            const startVal = startInput.value, endVal = endInput.value;
            const isStartValid = isValidDateString(startVal);
            const isEndValid = isValidEndDateString(endVal);
            startError.style.display = (!isStartValid && startVal !== "") ? 'block' : 'none';
            endError.style.display = (!isEndValid && endVal !== "") ? 'block' : 'none';
            if (isStartValid || startVal === "") experiences[idx].dateStart = startVal;
            if (isEndValid || endVal === "") experiences[idx].dateEnd = endVal;
          }
        }
        companyInput.addEventListener('input', updateExpData);
        positionInput.addEventListener('input', updateExpData);
        descInput.addEventListener('input', updateExpData);
        startInput.addEventListener('input', updateExpData);
        endInput.addEventListener('input', updateExpData);
        updateExpData();
      });
    }

    addExpBtn.addEventListener("click", () => {
      experiences.push({ company: "", position: "", dateStart: "", dateEnd: "", description: "" });
      renderExperiences();
    });

    const resumeTitleInput = document.getElementById("resumeTitle");
    const desiredPositionInput = document.getElementById("desiredPosition");
    const workScheduleSelect = document.getElementById("workSchedule");
    const aboutMeTextarea = document.getElementById("aboutMe");
    const cancelBtn = document.getElementById("cancelBtn");
    const publishBtn = document.getElementById("publishBtn");

    function resetForm() {
      if (resumeTitleInput) resumeTitleInput.value = "";
      if (desiredPositionInput) desiredPositionInput.value = "";
      if (workScheduleSelect) workScheduleSelect.value = "";
      aboutMeTextarea.value = "";
      selectedSkills = [];
      renderSkillsGrid();
      renderSelectedTags();
      experiences = [];
      renderExperiences();
    }

    async function checkAuth() {
      try {
        const response = await fetch(API_BASE_URL + "/auth/me", {
          method: "GET",
          credentials: "include",
        });
        if (!response.ok) {
          showNotification('Пожалуйста, авторизуйтесь для создания резюме', 'warning', 3000);
          setTimeout(() => {
            window.location.href = "./authorization_page.html";
          }, 1500);
          return false;
        }
        return true;
      } catch (error) {
        console.error('Auth check error:', error);
        showNotification('Ошибка соединения с сервером', 'error', 3000);
        return false;
      }
    }

    cancelBtn.addEventListener("click", () => {
      if (confirm("Отменить создание резюме? Все введённые данные будут сброшены.")) {
        resetForm();
        showNotification('Форма сброшена', 'success', 2000);
      }
    });

    publishBtn.addEventListener("click", async () => {
      const title = (resumeTitleInput?.value || "").trim();
      if (!title) {
        showNotification('Пожалуйста, заполните поле "Название резюме"', 'error');
        return;
      }

      const position = (desiredPositionInput?.value || "").trim();
      if (!position) {
        showNotification('Пожалуйста, заполните поле "Должность"', 'error');
        return;
      }

      const schedule = (workScheduleSelect?.value || "").trim();
      if (!schedule) {
        showNotification('Пожалуйста, выберите "График работы"', 'error');
        return;
      }

      const aboutText = aboutMeTextarea.value.trim();
      if (selectedSkills.length === 0) {
        showNotification('Пожалуйста, выберите хотя бы один навык из списка', 'warning');
        return;
      }

      const cleanedExperiences = (experiences || [])
        .map((exp) => ({
          company: (exp.company || "").trim(),
          position: (exp.position || "").trim(),
          dateStart: (exp.dateStart || "").trim(),
          dateEnd: (exp.dateEnd || "").trim(),
          description: (exp.description || "").trim(),
        }))
        // if user didn't have experience, allow empty list
        .filter((exp) => exp.company || exp.position || exp.dateStart || exp.dateEnd || exp.description);

      for (const exp of cleanedExperiences) {
        if (!exp.company) {
          showNotification('Заполните "Компания" в опыте работы (или удалите пустой блок)', 'error');
          return;
        }
        if (!exp.position) {
          showNotification('Заполните "Должность" в опыте работы (или удалите пустой блок)', 'error');
          return;
        }
        if (!exp.dateStart || !isValidDateString(exp.dateStart)) {
          showNotification('Укажите корректную "Дату прихода" (ДД.ММ.ГГГГ или ГГГГ-ММ-ДД)', 'error');
          return;
        }
        if (exp.dateEnd && !isValidEndDateString(exp.dateEnd)) {
          showNotification('Поле "Дата ухода" должно быть датой или текстом (например, "до сих пор")', 'error');
          return;
        }
      }

      const isAuth = await checkAuth();
      if (!isAuth) return;

      const resumeData = {
        title,
        position,
        schedule,
        about: aboutText || null,
        skills: selectedSkills,
        experience: cleanedExperiences.map(exp => ({
          company: exp.company,
          position: exp.position,
          date_start: exp.dateStart,
          // if user typed words ("до сих пор") - store as null end date
          date_end: (exp.dateEnd && isValidDateString(exp.dateEnd)) ? exp.dateEnd : null,
          description: exp.description || (exp.dateEnd && !isValidDateString(exp.dateEnd) ? `Дата ухода: ${exp.dateEnd}` : "")
        })),
      };

      try {
        const response = await fetch(API_BASE_URL + "/resumes/create", {
          method: "POST",
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: "include",
          body: JSON.stringify(resumeData),
        });

        if (response.ok) {
          showNotification('Резюме успешно создано!', 'success', 3000);
          resetForm();
          setTimeout(() => {
            window.location.href = "./account_employee.html";
          }, 1500);
        } else {
          const error = await response.json().catch(() => ({}));
          showNotification(error.detail || 'Ошибка при создании резюме', 'error', 3000);
        }
      } catch (error) {
        console.error('Create resume error:', error);
        showNotification('Не удалось подключиться к серверу', 'error', 3000);
      }
    });

    const roleSelect = document.getElementById("role-select");
    const roleBtn = document.getElementById("role-btn");
    const roleDropdown = document.getElementById("role-dropdown");
    const burgerBtn = document.getElementById("burger-btn");
    const headerMenu = document.getElementById("header-menu");

    function closeMenus() {
      if (roleSelect) roleSelect.classList.remove("open");
      if (headerMenu) headerMenu.classList.remove("open");
      if (burgerBtn) burgerBtn.classList.remove("open");
    }
    if (roleBtn) {
      roleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (roleSelect) roleSelect.classList.toggle("open");
        if (headerMenu) headerMenu.classList.remove("open");
        if (burgerBtn) burgerBtn.classList.remove("open");
      });
    }
    if (roleDropdown) {
      roleDropdown.addEventListener("click", (e) => {
        if (e.target.tagName === 'BUTTON' && roleBtn) {
          roleBtn.textContent = e.target.dataset.role || "Ищу сотрудника";
          if (roleSelect) roleSelect.classList.remove("open");
        }
      });
    }
    if (burgerBtn) {
      burgerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        burgerBtn.classList.toggle("open");
        if (headerMenu) headerMenu.classList.toggle("open");
        if (roleSelect) roleSelect.classList.remove("open");
      });
    }
    document.addEventListener("click", (e) => { if (!e.target.closest(".header__actions")) closeMenus(); });
    const logoutMenuItem = document.querySelector(".header-menu__exit");
    if (logoutMenuItem) {
      logoutMenuItem.addEventListener("click", async () => {
        try {
          await fetch(API_BASE_URL + "/auth/logout", {
            method: "POST",
            credentials: "include",
          });
        } catch (error) {
          console.error(error);
        } finally {
          showNotification('Вы вышли из системы', 'warning', 2000);
          setTimeout(() => {
            window.location.href = "./authorization_page.html";
          }, 1500);
        }
      });
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    renderSkillsGrid();
    renderSelectedTags();
    renderExperiences();
  })();
</script>
</body>
</html>
