<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка проекта | TeamPal</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2;
      --header: #eae8e4;
      --panel: #ffffff;
      --panel-soft: #fffaf3;
      --ink: #1a1a1a;
      --ink2: #3a3a3a;
      --line: rgba(0, 0, 0, 0.09);
      --accent-1: #fa9500;
      --accent-2: #f85a0b;
      --footer: #d4d3cb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      background: radial-gradient(900px 500px at -10% -25%, rgba(255, 208, 102, 0.28), transparent 70%),
                  radial-gradient(700px 420px at 110% 0%, rgba(248, 90, 11, 0.14), transparent 68%),
                  var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      height: 72px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }
    .header__inner {
      height: 100%;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .header__left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 46px; height: 46px; border-radius: 50px; object-fit: cover; }
    .header__actions { display: flex; align-items: center; gap: 12px; position: relative; }
    .role-toggle {
      display: flex;
      background: #f0ece7;
      border-radius: 999px;
      padding: 3px;
      border: 1px solid var(--line);
    }
    .role-toggle__btn {
      padding: 8px 18px;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #7a7060;
      transition: all 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .role-toggle__btn.active {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      box-shadow: 0 2px 8px rgba(248, 90, 11, 0.25);
    }
    .notify-btn {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .notify-btn:hover {
      background: linear-gradient(135deg, #fff5e8, #ffffff);
      border-color: rgba(248, 90, 11, 0.55);
      box-shadow: 0 8px 18px rgba(250, 149, 0, 0.18);
    }
    .notify-btn svg { width: 22px; height: 22px; display: block; }
    .burger {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .burger span { width: 22px; height: 2.5px; background: linear-gradient(90deg, #5a4a3a, #3a2a1a); border-radius: 4px; display: block; }
    .header-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 12px);
      width: 244px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px 8px;
      display: none;
    }
    .header-menu.open { display: block; }
    .header-menu__title { font-size: 12px; font-weight: 500; text-transform: uppercase; color: #8b8b8b; margin-bottom: 12px; padding: 0 10px; }
    .header-menu__item, .header-menu__exit {
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 14px;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink);
      font-family: inherit;
    }
    .header-menu__item:hover { background: linear-gradient(95deg, #fff5e8, #fffbf5); color: var(--accent-2); }
    .header-menu__exit { margin-top: 8px; margin-bottom: 0; color: #d14b2a; border-top: 1px solid var(--line); border-radius: 0; padding-top: 12px; }
    .page { width: 100%; max-width: 1160px; margin: 0 auto; padding: 102px 20px 26px; flex: 1; }
    .card { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06); }
    .top { padding: 18px 20px; margin-bottom: 14px; background: linear-gradient(180deg, rgba(255, 208, 102, 0.16), transparent 38%), #fff; }
    .title { font-size: 28px; color: var(--accent-2); line-height: 1.15; }
    .sub { margin-top: 6px; color: #6d6155; font-size: 14px; }
    .grid { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .field { border: 1px solid #ece9e5; border-radius: 12px; background: #faf9f7; padding: 10px 12px; font-size: 13px; }
    .field b { color: #6a625b; margin-right: 4px; }
    .section { padding: 18px 20px; margin-bottom: 14px; }
    .section h2 { font-size: 20px; margin-bottom: 10px; color: #2d2a24; }
    .text { white-space: pre-wrap; line-height: 1.5; color: #2e2b27; background: var(--panel-soft); border: 1px solid #f0ebe4; border-radius: 14px; padding: 12px; }
    .progress {
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff4ea;
      border: 1px solid rgba(248, 90, 11, 0.2);
      color: #874427;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .vacancies { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .vacancy { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 14px; }
    .vacancy-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .vacancy-title { font-size: 18px; font-weight: 700; color: var(--accent-2); }
    .badge { border-radius: 10px; font-size: 12px; font-weight: 600; padding: 5px 9px; border: 1px solid #ddd; background: #f2f2f2; color: #494949; white-space: nowrap; }
    .badge.taken { border-color: rgba(78, 139, 74, 0.3); background: #eaf8ea; color: #2e6f2a; }
    .badge.open { border-color: rgba(248, 90, 11, 0.3); background: #fff4ea; color: #8b4b1b; }
    .meta { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 10px; }
    .taken-users { margin-top: 10px; border-top: 1px dashed #ece5dd; padding-top: 10px; font-size: 13px; color: #3a3a3a; }
    .users-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; }
    .user-chip { border-radius: 999px; padding: 5px 10px; border: 1px solid #d7e9d5; background: #f3fbf2; font-size: 12px; color: #2d6c2a; }
    .footer { width: 100%; background: var(--footer); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; color: var(--ink2); min-height: 52px; flex-wrap: wrap; }
    .empty { border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); padding: 18px; color: #7a7a7a; text-align: center; }
    @media (max-width: 700px) {
      .header__inner { padding: 0 16px; }
      .page { padding: 92px 14px 24px; }
      .role-toggle__btn { padding: 7px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <img class="logo" src="./assets/logo.png" alt="Логотип TeamPal">
      <div class="role-toggle" id="role-toggle">
        <button class="role-toggle__btn" type="button" data-role="Ищу вакансию">Ищу вакансию</button>
        <button class="role-toggle__btn active" type="button" data-role="Ищу сотрудника">Ищу сотрудника</button>
      </div>
    </div>
    <div class="header__actions">
      <button class="notify-btn" type="button" aria-label="Уведомления" onclick="window.location.href='./notifications.html'">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 4a5 5 0 0 0-5 5v2.6c0 .7-.24 1.38-.68 1.9L5 15h14l-1.32-1.5a3 3 0 0 1-.68-1.9V9a5 5 0 0 0-5-5Z" stroke="#f85a0b" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10 18a2 2 0 0 0 4 0" stroke="#f85a0b" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="burger" id="burger-btn" type="button" aria-label="Открыть меню"><span></span><span></span><span></span></button>
      <nav class="header-menu" id="header-menu">
        <div class="header-menu__title">Меню</div>
        <button class="header-menu__item" type="button" data-nav="./account_manager.html">Личный кабинет</button>
        <button class="header-menu__item" type="button" data-nav="./search_resume.html">Поиск</button>
        <button class="header-menu__item" type="button" data-nav="./support_project.html">Поддержать проект</button>
        <button class="header-menu__exit" type="button" data-nav="./authorization_page.html">Выйти</button>
      </nav>
    </div>
  </div>
</header>

<main class="page">
  <section class="card top">
    <h1 class="title" id="project-title">Карточка проекта</h1>
    <div class="sub" id="project-sub">Загрузка...</div>
    <div class="grid" id="project-main-fields"></div>
  </section>

  <section class="card section">
    <h2>Описание проекта</h2>
    <div class="text" id="project-description">—</div>
  </section>

  <section class="card section">
    <h2>Задачи проекта</h2>
    <div class="text" id="project-tasks">—</div>
  </section>

  <section class="card section">
    <h2>Вакансии</h2>
    <div class="progress" id="team-progress">В проекте: 0/0</div>
    <div class="vacancies" id="vacancies-list"></div>
  </section>
</main>

<footer class="footer">
  <span>TeamPal <span id="year"></span></span>
  <span>обратная связь: teampal@dimple.ru</span>
</footer>

<script src="./config.js"></script>
<script>
  (function () {
    const yearSpan = document.getElementById("year");
    if (yearSpan) yearSpan.textContent = " " + new Date().getFullYear();

    const roleToggle = document.getElementById("role-toggle");
    const burgerBtn = document.getElementById("burger-btn");
    const headerMenu = document.getElementById("header-menu");
    function closeMenus() { if (headerMenu) headerMenu.classList.remove("open"); if (burgerBtn) burgerBtn.classList.remove("open"); }
    if (roleToggle) {
      roleToggle.addEventListener("click", function (event) {
        const btn = event.target.closest(".role-toggle__btn");
        if (!btn) return;
        const role = btn.dataset.role || "Ищу сотрудника";
        try { localStorage.setItem("tp_role", role); } catch (_) {}
        roleToggle.querySelectorAll(".role-toggle__btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        if (role === "Ищу вакансию") window.location.href = "./search_project.html";
      });
    }
    if (burgerBtn && headerMenu) burgerBtn.addEventListener("click", (e) => { e.stopPropagation(); burgerBtn.classList.toggle("open"); headerMenu.classList.toggle("open"); });
    document.addEventListener("click", (e) => { if (!e.target.closest(".header__actions")) closeMenus(); });
    document.querySelectorAll("[data-nav]").forEach((btn) => btn.addEventListener("click", () => { const href = btn.getAttribute("data-nav"); if (href) window.location.href = href; }));

    function esc(v) { return String(v == null ? "" : v).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }
    function mapIntent(v) { return v === "commercial" ? "Коммерческий" : (v === "noncommercial" ? "Некоммерческий" : "—"); }
    function mapStatus(v) { return v === "active" ? "Активен" : (v === "paused" ? "Пауза" : (v || "—")); }
    function mapExp(v) { return ({ none: "Без опыта", "<1": "До 1 года", "1-3": "1-3 года", "3-6": "3-6 лет", "6+": "6+ лет" })[v] || "—"; }
    function mapWork(v) { return ({ remote: "Удаленно", office: "Офис", hybrid: "Гибрид" })[v] || "—"; }
    function mapEmployment(v) { return ({ full_time: "Полная", part_time: "Частичная", side_project: "Подработка" })[v] || "—"; }
    function mapContract(v) { return ({ gph: "ГПХ", tk: "ТК РФ", internship: "Стажировка" })[v] || "—"; }
    function salary(v, t) { if (v == null || v === "") return "—"; const n = Number(v); if (!Number.isFinite(n)) return "—"; const unit = t === "per_project" ? "за проект" : "в месяц"; return n.toLocaleString("ru-RU") + " ₽ " + unit; }

    function extractUsers(vacancy) {
      const sources = [];
      if (Array.isArray(vacancy.occupied_by_users)) sources.push(...vacancy.occupied_by_users);
      if (Array.isArray(vacancy.assigned_users)) sources.push(...vacancy.assigned_users);
      if (Array.isArray(vacancy.members)) sources.push(...vacancy.members);
      if (Array.isArray(vacancy.participants)) sources.push(...vacancy.participants);
      if (vacancy.user) sources.push(vacancy.user);
      if (vacancy.assigned_user) sources.push(vacancy.assigned_user);
      if (vacancy.resume && vacancy.resume.user) sources.push(vacancy.resume.user);
      const names = sources.map((u) => {
        if (!u) return "";
        if (typeof u === "string") return u;
        const full = [u.last_name, u.first_name].filter(Boolean).join(" ").trim();
        return full || u.full_name || u.username || u.email || "";
      }).filter(Boolean);
      return Array.from(new Set(names));
    }

    async function loadCitiesMap() {
      try {
        const resp = await fetch(API_BASE_URL + "/cities", { credentials: "include" });
        if (!resp.ok) return {};
        const arr = await resp.json();
        const map = {};
        if (Array.isArray(arr)) arr.forEach((c) => { if (c && c.id != null) map[String(c.id)] = c.title || String(c.id); });
        return map;
      } catch (_) { return {}; }
    }

    async function loadData() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        document.getElementById("project-sub").textContent = "ID проекта не указан";
        return;
      }
      const citiesMap = await loadCitiesMap();
      try {
        const resp = await fetch(API_BASE_URL + "/my_project/" + id, { credentials: "include" });
        if (!resp.ok) throw new Error("Не удалось загрузить проект");
        const data = await resp.json();
        const project = data.project || data;
        const vacancies = Array.isArray(data.vacancies) ? data.vacancies : (Array.isArray(project.vacancies) ? project.vacancies : []);

        document.getElementById("project-title").textContent = project.title || "Без названия";
        document.getElementById("project-sub").textContent = (project.company_name ? project.company_name + " • " : "") + mapIntent(project.employment_intent);
        document.getElementById("project-description").textContent = project.description || "Описание не заполнено";
        document.getElementById("project-tasks").textContent = project.tasks || "Задачи не заполнены";

        const mainFields = [
          ["Тип проекта", mapIntent(project.employment_intent)],
          ["Статус", mapStatus(project.status)],
          ["Город", citiesMap[String(project.city_id)] || "—"],
          ["План участников", project.planned_members != null ? project.planned_members : "—"],
          ["Сроки", project.deadline || "—"],
          ["Создан", project.created_at ? new Date(project.created_at).toLocaleDateString("ru-RU") : "—"],
          ["Контакт", project.contact_info || project.contact || "—"],
        ];
        document.getElementById("project-main-fields").innerHTML = mainFields.map((f) => `<div class="field"><b>${esc(f[0])}:</b>${esc(f[1])}</div>`).join("");

        const list = document.getElementById("vacancies-list");
        if (vacancies.length === 0) {
          list.innerHTML = '<div class="empty">По этому проекту пока нет вакансий</div>';
          document.getElementById("team-progress").textContent = "В проекте: 0/0";
          return;
        }

        let occupiedSlots = 0;
        list.innerHTML = vacancies.map((v) => {
          const users = extractUsers(v);
          const isTaken = users.length > 0 || v.is_filled === true || v.status === "filled" || v.status === "closed";
          if (isTaken) occupiedSlots += 1;
          return `
            <article class="vacancy">
              <div class="vacancy-head">
                <div class="vacancy-title">${esc(v.role_name || v.role_type?.name || "Роль")}</div>
                <span class="badge ${isTaken ? "taken" : "open"}">${isTaken ? "Занята" : "Свободна"}</span>
              </div>
              <div class="meta">
                <div class="field"><b>Опыт:</b>${esc(mapExp(v.experience))}</div>
                <div class="field"><b>Формат:</b>${esc(mapWork(v.work_format))}</div>
                <div class="field"><b>Занятость:</b>${esc(mapEmployment(v.employment))}</div>
                <div class="field"><b>График:</b>${esc(v.schedule || "—")}</div>
                <div class="field"><b>Зарплата:</b>${esc(salary(v.salary_amount, v.salary_type))}</div>
                <div class="field"><b>Договор:</b>${esc(mapContract(v.contract_type))}</div>
              </div>
              <div class="taken-users">
                <div><b>Кто занимает вакансию:</b> ${users.length ? "" : "пока никто"}</div>
                ${users.length ? `<div class="users-list">${users.map((u) => `<span class="user-chip">${esc(u)}</span>`).join("")}</div>` : ""}
              </div>
              ${v.requirements ? `<div class="text" style="margin-top:10px;"><b>Требования:</b> ${esc(v.requirements)}</div>` : ""}
              ${v.responsibilities ? `<div class="text" style="margin-top:10px;"><b>Обязанности:</b> ${esc(v.responsibilities)}</div>` : ""}
            </article>
          `;
        }).join("");

        const totalSlots = Number.isFinite(Number(project.planned_members)) && Number(project.planned_members) > 0
          ? Number(project.planned_members)
          : vacancies.length;
        document.getElementById("team-progress").textContent = "В проекте: " + occupiedSlots + "/" + totalSlots;
      } catch (e) {
        document.getElementById("project-sub").textContent = "Ошибка загрузки проекта";
        document.getElementById("vacancies-list").innerHTML = '<div class="empty">Не удалось загрузить данные. Проверьте доступ или попробуйте позже.</div>';
      }
    }

    loadData();
  })();
</script>
</body>
</html>
