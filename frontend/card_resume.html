<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка резюме | TeamPal</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2; --header: #eae8e4; --panel: #ffffff; --panel-soft: #fffaf3;
      --ink: #1a1a1a; --ink2: #3a3a3a; --line: rgba(0, 0, 0, 0.09);
      --accent-1: #fa9500; --accent-2: #f85a0b; --footer: #d4d3cb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      background: radial-gradient(900px 500px at -10% -25%, rgba(255, 208, 102, 0.28), transparent 70%),
                  radial-gradient(700px 420px at 110% 0%, rgba(248, 90, 11, 0.14), transparent 68%), var(--bg);
      color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
    }
    .header { position: fixed; inset: 0 0 auto 0; z-index: 1000; height: 72px; background: var(--header); border-bottom: 1px solid var(--line); }
    .header__inner { height: 100%; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .header__left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 46px; height: 46px; border-radius: 50px; object-fit: cover; }
    .header__actions { display: flex; align-items: center; gap: 12px; position: relative; }
    .role-toggle { display: flex; background: #f0ece7; border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
    .role-toggle__btn { padding: 8px 18px; border: none; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: #7a7060; font-family: inherit; }
    .role-toggle__btn.active { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; box-shadow: 0 2px 8px rgba(248,90,11,.25); }
    .notify-btn {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .notify-btn:hover { background: linear-gradient(135deg, #fff5e8, #ffffff); border-color: rgba(248, 90, 11, 0.55); box-shadow: 0 8px 18px rgba(250, 149, 0, 0.18); }
    .notify-btn svg { width: 22px; height: 22px; display: block; }
    .burger { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
    .burger span { width: 22px; height: 2.5px; background: linear-gradient(90deg, #5a4a3a, #3a2a1a); border-radius: 4px; display: block; }
    .header-menu { position: absolute; right: 0; top: calc(100% + 12px); width: 244px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 12px 8px; display: none; }
    .header-menu.open { display: block; }
    .header-menu__title { font-size: 12px; font-weight: 500; text-transform: uppercase; color: #8b8b8b; margin-bottom: 12px; padding: 0 10px; }
    .header-menu__item, .header-menu__exit { width: 100%; border: 0; background: transparent; border-radius: 14px; text-align: left; padding: 10px 14px; margin-bottom: 4px; cursor: pointer; font-size: 14px; color: var(--ink); font-family: inherit; }
    .header-menu__exit { margin-top: 8px; margin-bottom: 0; color: #d14b2a; border-top: 1px solid var(--line); border-radius: 0; padding-top: 12px; }
    .page { width: 100%; max-width: 1160px; margin: 0 auto; padding: 102px 20px 26px; flex: 1; }
    .card { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 12px 30px rgba(0,0,0,.06); }
    .top { padding: 18px 20px; margin-bottom: 14px; background: linear-gradient(180deg, rgba(255,208,102,.16), transparent 38%), #fff; }
    .title { font-size: 28px; color: var(--accent-2); line-height: 1.15; }
    .sub { margin-top: 6px; color: #6d6155; font-size: 14px; }
    .grid { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .field { border: 1px solid #ece9e5; border-radius: 12px; background: #faf9f7; padding: 10px 12px; font-size: 13px; }
    .field b { color: #6a625b; margin-right: 4px; }
    .section { padding: 18px 20px; margin-bottom: 14px; }
    .section h2 { font-size: 20px; margin-bottom: 10px; color: #2d2a24; }
    .text { white-space: pre-wrap; line-height: 1.5; color: #2e2b27; background: var(--panel-soft); border: 1px solid #f0ebe4; border-radius: 14px; padding: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border-radius: 999px; padding: 6px 10px; border: 1px solid rgba(248,90,11,.16); background: #fff3e8; color: #83451f; font-size: 12px; }
    .exp-list { display: grid; gap: 10px; }
    .exp { border: 1px solid #ece4db; border-radius: 12px; background: #fff; padding: 12px; }
    .exp-title { color: var(--accent-2); font-weight: 700; }
    .exp-meta { margin-top: 6px; color: #5c5c5c; font-size: 13px; }
    .footer { width: 100%; background: var(--footer); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; color: var(--ink2); min-height: 52px; flex-wrap: wrap; }
    .empty { border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); padding: 18px; color: #7a7a7a; text-align: center; }
    .page-back-row { margin-bottom: 12px; }
    .page-back-btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px 18px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink2);
      transition: border-color .2s, color .2s;
    }
    .page-back-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
    .invite-action-bar { margin-bottom: 14px; }
    .invite-action-bar .action-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      box-shadow: 0 4px 14px rgba(248, 90, 11, 0.28);
    }
    .invite-action-bar .action-btn:hover { filter: brightness(1.03); }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2500;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal__card--premium {
      width: min(92vw, 480px);
      border-radius: 22px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.18);
    }
    .modal__accent-strip { height: 5px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
    .modal__body { padding: 20px 22px 16px; }
    .modal__title-lg { font-size: 22px; font-weight: 700; margin: 0; color: var(--ink); }
    .modal__subtitle { margin: 8px 0 0; font-size: 14px; color: #666; line-height: 1.45; }
    .modal__footer-bar {
      padding: 14px 22px 18px;
      background: linear-gradient(180deg, #faf9f7, #fff);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .invite-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #faf9f7;
      font-size: 13px;
    }
    .invite-preview-grid div b { color: #6a625b; display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
    .invite-preview-about {
      grid-column: 1 / -1;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .modal .field label { font-size: 13px; color: #4c4c4c; font-weight: 500; display: block; margin-bottom: 6px; }
    .modal .field select {
      width: 100%;
      border: 2px solid #dfdfdf;
      border-radius: 10px;
      padding: 10px 11px;
      font-family: inherit;
      font-size: 14px;
    }
    .modal .action-btn {
      border-radius: 12px;
      padding: 10px 18px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
    }
    .modal .action-btn--accent {
      border: none;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
    }
    @media (max-width: 700px) { .header__inner { padding: 0 16px; } .page { padding: 92px 14px 24px; } .role-toggle__btn { padding: 7px 14px; font-size: 12px; } }
  </style>
</head>
<body>
<header class="header">
  <div class="header__inner">
    <div class="header__left">
      <img class="logo" src="./assets/logo.png" alt="Логотип TeamPal">
      <div class="role-toggle" id="role-toggle">
        <button class="role-toggle__btn active" type="button" data-role="Ищу вакансию">Ищу вакансию</button>
        <button class="role-toggle__btn" type="button" data-role="Ищу сотрудника">Ищу сотрудника</button>
      </div>
    </div>
    <div class="header__actions">
      <button class="notify-btn" type="button" aria-label="Отклики" onclick="window.location.href='./applications.html'">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 4a5 5 0 0 0-5 5v2.6c0 .7-.24 1.38-.68 1.9L5 15h14l-1.32-1.5a3 3 0 0 1-.68-1.9V9a5 5 0 0 0-5-5Z" stroke="#f85a0b" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10 18a2 2 0 0 0 4 0" stroke="#f85a0b" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="burger" id="burger-btn" type="button"><span></span><span></span><span></span></button>
      <nav class="header-menu" id="header-menu">
        <div class="header-menu__title">Меню</div>
        <button class="header-menu__item" type="button" data-nav="./account_employee.html">Личный кабинет</button>
        <button class="header-menu__item" type="button" data-nav="./search_project.html">Поиск</button>
        <button class="header-menu__item" type="button" data-nav="./support_project.html">Поддержать проект</button>
        <button class="header-menu__exit" type="button" data-nav="./authorization_page.html">Выйти</button>
      </nav>
    </div>
  </div>
</header>

<main class="page">
  <p class="page-back-row"><button type="button" class="page-back-btn" id="page-back">← Назад к поиску</button></p>
  <div class="invite-action-bar" id="resume-invite-bar" hidden>
    <button type="button" class="action-btn action-btn--accent" id="resume-invite-open">Пригласить кандидата</button>
  </div>
  <section class="card top">
    <h1 class="title" id="resume-title">Карточка резюме</h1>
    <div class="sub" id="resume-sub">Загрузка...</div>
    <div class="grid" id="resume-main-fields"></div>
  </section>

  <section class="card section" id="resume-about-section">
    <h2>О себе</h2>
    <div class="text" id="resume-about">—</div>
  </section>

  <section class="card section">
    <h2>Стек технологий / Скиллы</h2>
    <div class="chips" id="resume-skills"></div>
  </section>

  <section class="card section">
    <h2>Опыт работы</h2>
    <div class="exp-list" id="resume-experiences"></div>
  </section>

  <section class="card section">
    <h2>Контакты</h2>
    <div class="grid" id="resume-contacts"></div>
  </section>
</main>

<div class="modal" id="invite-modal-card" aria-hidden="true">
  <div class="modal__card modal__card--premium" role="dialog" aria-modal="true" aria-label="Пригласить кандидата">
    <div class="modal__accent-strip"></div>
    <div class="modal__body">
      <h2 class="modal__title-lg">Пригласить кандидата</h2>
      <p id="invite-resume-label-card" class="modal__subtitle"></p>
      <div id="invite-resume-preview-card" class="invite-preview-grid"></div>
      <div class="field" style="margin-top:14px;">
        <label for="invite-vacancy-select-card">Выберите свою вакансию</label>
        <select id="invite-vacancy-select-card"></select>
      </div>
      <div id="invite-no-vacancies-card" style="display:none;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff8e6;border:1px solid #ffe082;color:#6d4c41;font-size:13px;line-height:1.45;">
        Нет свободных слотов в активных проектах. Создайте вакансию в проекте или верните проект со статуса паузы.
      </div>
    </div>
    <div class="modal__footer-bar">
      <button class="action-btn" id="invite-cancel-card" type="button">Отмена</button>
      <button class="action-btn action-btn--accent" id="invite-confirm-card" type="button">Отправить приглашение</button>
    </div>
  </div>
</div>

<footer class="footer">
  <span>TeamPal <span id="year"></span></span>
  <span>обратная связь: teampal@dimple.ru</span>
</footer>

<script src="./config.js"></script>
<script>
  (function () {
    const yearSpan = document.getElementById("year");
    if (yearSpan) yearSpan.textContent = " " + new Date().getFullYear();

    const roleToggle = document.getElementById("role-toggle");
    const burgerBtn = document.getElementById("burger-btn");
    const headerMenu = document.getElementById("header-menu");
    function closeMenus() { if (headerMenu) headerMenu.classList.remove("open"); if (burgerBtn) burgerBtn.classList.remove("open"); }
    if (roleToggle) roleToggle.addEventListener("click", function (event) {
      const btn = event.target.closest(".role-toggle__btn"); if (!btn) return;
      const role = btn.dataset.role || "Ищу вакансию";
      try { localStorage.setItem("tp_role", role); } catch (_) {}
      roleToggle.querySelectorAll(".role-toggle__btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      if (role === "Ищу сотрудника") window.location.href = "./search_resume.html";
    });
    if (burgerBtn && headerMenu) burgerBtn.addEventListener("click", (e) => { e.stopPropagation(); burgerBtn.classList.toggle("open"); headerMenu.classList.toggle("open"); });
    document.addEventListener("click", (e) => { if (!e.target.closest(".header__actions")) closeMenus(); });
    document.querySelectorAll("[data-nav]").forEach((btn) => btn.addEventListener("click", () => { const href = btn.getAttribute("data-nav"); if (href) window.location.href = href; }));

    document.getElementById("page-back")?.addEventListener("click", () => {
      if (document.referrer && document.referrer.includes("search_resume.html")) history.back();
      else window.location.href = "./search_resume.html";
    });

    function esc(v) { return String(v == null ? "" : v).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }
    function mapResumeTypeCard(v) {
      return v === "commercial" ? "Коммерческий проект" : (v === "noncommercial" ? "Учебный проект" : "—");
    }
    function mapCommit(v) { return ({ full_time: "Полный день", part_time: "Неполный день", side_project: "Подработка / гибкий формат" })[v] || "—"; }
    function mapWork(v) { return ({ remote: "Удалённо", office: "В офисе", hybrid: "Гибрид" })[v] || "—"; }
    function mapSchedule(v) { return ({ "5/2": "5/2", "2/2": "2/2", "4/2": "4/2", "3/3": "3/3" })[v] || "—"; }
    function mapContract(v) { return ({ gph: "ГПХ", tk: "ТК РФ", internship: "Стажировка" })[v] || "—"; }
    function mapExpBucket(v) {
      return ({ none: "Без опыта", "<1": "До 1 года", "1-3": "1–3 года", "3-6": "3–6 лет", "6+": "6+ лет" })[v] || "—";
    }
    function mapSalaryTypeLabel(t) {
      return t === "per_project" ? "За проект" : (t === "monthly" ? "В месяц" : "—");
    }
    function salaryAmountOnly(v) {
      if (v == null || v === "") return "—";
      const n = Number(v);
      if (!Number.isFinite(n)) return "—";
      return n.toLocaleString("ru-RU") + " ₽";
    }
    function aboutMePlain(rd) {
      const raw = rd && rd.about_me != null ? String(rd.about_me).trim() : "";
      return raw || "Не указано";
    }
    function fmtDate(v) { if (!v) return "—"; const d = new Date(v); return isNaN(d.getTime()) ? String(v) : d.toLocaleDateString("ru-RU"); }

    function buildResumeMainPreviewRows(rd) {
      const rows = [
        ["Желаемая должность", rd.desired_position || "—"],
        ["Опыт работы", mapExpBucket(rd.computed_experience_level)],
      ];
      if (rd.employment_intent === "commercial") {
        rows.push(
          ["Формат работы", mapWork(rd.work_format)],
          ["Занятость", mapCommit(rd.commitment_level)],
          ["График", mapSchedule(rd.schedule)],
          ["Заработная плата (в рублях)", salaryAmountOnly(rd.salary_amount)],
          ["Тип зарплаты", mapSalaryTypeLabel(rd.salary_type)],
          ["Тип договора", mapContract(rd.contract_type)],
        );
      }
      return rows;
    }

    function resumePreviewCells(rd, skillMap) {
      const skillLabels = (Array.isArray(rd.skills) ? rd.skills : []).slice(0, 12).map((s) => {
        if (typeof s === "string") return s;
        if (s && typeof s === "object") {
          let lab = (s.name || s.title || "").trim();
          if (!lab && s.skill_id != null) lab = skillMap[String(s.skill_id)] || ("#" + s.skill_id);
          return lab || "";
        }
        return "";
      }).filter(Boolean);
      const rows = buildResumeMainPreviewRows(rd).concat([
        ["Стек технологий / Скиллы", skillLabels.length ? skillLabels.join(", ") : "—"],
      ]);
      const cells = rows.map(([k, val]) => `<div><b>${esc(k)}</b>${esc(val)}</div>`).join("");
      const aboutVal = aboutMePlain(rd);
      const aboutBlock = `<div class="invite-preview-about"><b>${esc("О себе")}</b>${esc(aboutVal)}</div>`;
      return cells + aboutBlock;
    }

    let inviteResumeNumericId = null;

    async function openInviteModalCard(resumeIdNum, rd, skillMap) {
      inviteResumeNumericId = resumeIdNum;
      const modal = document.getElementById("invite-modal-card");
      const labelEl = document.getElementById("invite-resume-label-card");
      const prevEl = document.getElementById("invite-resume-preview-card");
      const sel = document.getElementById("invite-vacancy-select-card");
      const noVac = document.getElementById("invite-no-vacancies-card");
      if (labelEl) labelEl.textContent = rd.desired_position || "Резюме";
      if (prevEl) prevEl.innerHTML = resumePreviewCells(rd, skillMap);
      if (noVac) noVac.style.display = "none";
      if (modal) modal.classList.add("open");
      if (sel) sel.innerHTML = '<option value="">Загрузка…</option>';
      try {
        const r = await fetch(API_BASE_URL + "/my_recruiting_vacancies", { credentials: "include" });
        if (r.status === 401) {
          window.alert("Войдите в аккаунт работодателя.");
          modal?.classList.remove("open");
          return;
        }
        if (!r.ok) {
          if (sel) sel.innerHTML = '<option value="">Ошибка загрузки</option>';
          return;
        }
        const opts = await r.json();
        if (!Array.isArray(opts) || opts.length === 0) {
          if (sel) sel.innerHTML = '<option value="">— нет —</option>';
          if (noVac) noVac.style.display = "block";
          return;
        }
        if (sel) {
          sel.innerHTML = '<option value="">— выберите вакансию —</option>' +
            opts.map((o) => {
              const vid = Number(o.vacancy_id);
              const label = (o.project_title || "Проект") + " · " + (o.role_name || "Должность");
              return `<option value="${vid}">${esc(label)}</option>`;
            }).join("");
        }
      } catch {
        if (sel) sel.innerHTML = '<option value="">Ошибка соединения</option>';
      }
    }

    function closeInviteModalCard() {
      document.getElementById("invite-modal-card")?.classList.remove("open");
      inviteResumeNumericId = null;
    }

    document.getElementById("invite-cancel-card")?.addEventListener("click", closeInviteModalCard);
    document.getElementById("invite-modal-card")?.addEventListener("click", (e) => { if (e.target.id === "invite-modal-card") closeInviteModalCard(); });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeInviteModalCard();
    });
    document.getElementById("invite-confirm-card")?.addEventListener("click", async () => {
      const sel = document.getElementById("invite-vacancy-select-card");
      const vacancyId = sel ? sel.value : "";
      if (!vacancyId || inviteResumeNumericId == null) return;
      const btn = document.getElementById("invite-confirm-card");
      if (btn) btn.disabled = true;
      try {
        const r = await fetch(API_BASE_URL + "/vacancies/" + encodeURIComponent(vacancyId) + "/invite_resume", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ resume_id: inviteResumeNumericId }),
        });
        if (r.ok) {
          closeInviteModalCard();
          window.alert("Приглашение отправлено.");
        } else {
          const err = await r.json().catch(() => ({}));
          window.alert("Ошибка: " + (typeof err.detail === "string" ? err.detail : "Не удалось отправить"));
        }
      } catch {
        window.alert("Ошибка соединения с сервером");
      }
      if (btn) btn.disabled = false;
    });

    document.getElementById("resume-invite-open")?.addEventListener("click", () => {
      const pid = new URLSearchParams(window.location.search).get("id");
      if (!pid || !window._tpCardResumePayload) return;
      const { resumeData: rd, skillMap: sm } = window._tpCardResumePayload;
      openInviteModalCard(parseInt(pid, 10), rd, sm);
    });

    let skillsCatalogCache = null;
    async function loadSkillsCatalogMap() {
      if (skillsCatalogCache) return skillsCatalogCache;
      try {
        const r = await fetch(API_BASE_URL + "/skills", { credentials: "include" });
        if (!r.ok) return {};
        const arr = await r.json();
        const map = {};
        if (Array.isArray(arr)) arr.forEach((x) => { if (x && x.id != null) map[String(x.id)] = x.name || ""; });
        skillsCatalogCache = map;
        return map;
      } catch {
        skillsCatalogCache = {};
        return skillsCatalogCache;
      }
    }

    async function loadResume() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const userId = params.get("user_id") || params.get("user");
      if (!id) {
        document.getElementById("resume-sub").textContent = "ID резюме не указан";
        return;
      }

      const skillMap = await loadSkillsCatalogMap();

      let resumeData = null;
      const paths = [];
      if (userId) paths.push("/profiles/" + encodeURIComponent(userId) + "/resumes/" + encodeURIComponent(id));
      paths.push("/resumes/" + encodeURIComponent(id), "/my_resume/" + encodeURIComponent(id));
      for (const path of paths) {
        try {
          const r = await fetch(API_BASE_URL + path, { credentials: "include" });
          if (r.ok) {
            const data = await r.json();
            resumeData = data.resume || data;
            const skillsArr = Array.isArray(data.skills) ? data.skills : resumeData.skills;
            const expArr = Array.isArray(data.experiences) ? data.experiences : resumeData.experiences;
            resumeData.skills = Array.isArray(skillsArr) ? skillsArr : [];
            resumeData.experiences = Array.isArray(expArr) ? expArr : [];
            break;
          }
        } catch (_) {}
      }
      if (!resumeData) {
        document.getElementById("resume-sub").textContent = "Не удалось загрузить резюме";
        document.getElementById("resume-experiences").innerHTML = '<div class="empty">Проверьте доступ или попробуйте позже</div>';
        return;
      }

      const displayTitle = resumeData.title || resumeData.desired_position || "Резюме";
      document.getElementById("resume-title").textContent = displayTitle;
      const subLine = (resumeData.desired_position ? String(resumeData.desired_position) + " · " : "") + mapResumeTypeCard(resumeData.employment_intent);
      document.getElementById("resume-sub").textContent = subLine;

      const bar = document.getElementById("resume-invite-bar");
      if (bar) {
        bar.hidden = true;
        if (userId) {
          try {
            const meR = await fetch(API_BASE_URL + "/profiles/me", { credentials: "include" });
            if (meR.ok) {
              const me = await meR.json();
              if (Number(me.user_id) !== Number(userId)) bar.hidden = false;
            }
          } catch (_) {}
        }
      }
      window._tpCardResumePayload = { resumeData, skillMap };

      const aboutSection = document.getElementById("resume-about-section");
      const aboutRaw = resumeData.about_me != null ? String(resumeData.about_me).trim() : "";
      document.getElementById("resume-about").textContent = aboutRaw || "Не указано";
      if (aboutSection) aboutSection.style.display = "";

      const contacts = resumeData.contacts || resumeData.profile?.contacts || {};
      const mainFields = buildResumeMainPreviewRows(resumeData);
      document.getElementById("resume-main-fields").innerHTML = mainFields.map((f) => `<div class="field"><b>${esc(f[0])}:</b>${esc(f[1])}</div>`).join("");

      const skills = Array.isArray(resumeData.skills) ? resumeData.skills : [];
      document.getElementById("resume-skills").innerHTML = skills.length
        ? skills.map((s) => {
          let label = "";
          if (typeof s === "string") label = s;
          else if (s && typeof s === "object") {
            label = (s.name || s.title || "").trim();
            if (!label && s.skill_id != null) label = skillMap[String(s.skill_id)] || ("Навык #" + s.skill_id);
          }
          return `<span class="chip">${esc(label || "—")}</span>`;
        }).join("")
        : '<div class="empty" style="width:100%;">Стек не указан — отметьте навыки при редактировании резюме</div>';

      const experiences = Array.isArray(resumeData.experiences) ? resumeData.experiences : [];
      document.getElementById("resume-experiences").innerHTML = experiences.length
        ? experiences.map((e) => `
            <article class="exp">
              <div class="exp-meta"><b>Компания:</b> ${esc(e.company_name || "—")}</div>
              <div class="exp-meta"><b>Должность:</b> ${esc(e.position || "—")}</div>
              <div class="exp-meta"><b>Период:</b> ${esc(fmtDate(e.start_date))} — ${esc(e.end_date ? fmtDate(e.end_date) : "по настоящее время")}</div>
              <div class="text" style="margin-top:8px;"><b>Описание обязанностей:</b> ${esc(e.description || "—")}</div>
            </article>
          `).join("")
        : '<div class="empty">Опыт работы не указан</div>';

      const contactsRows = [
        ["Телефон", contacts.phone || "—"],
        ["Telegram", contacts.telegram || "—"],
        ["GitHub", contacts.github || "—"],
      ];
      const contactsEl = document.getElementById("resume-contacts");
      if (contactsEl) {
        contactsEl.innerHTML = contactsRows.map((f) => `<div class="field"><b>${esc(f[0])}:</b>${esc(f[1])}</div>`).join("");
      }
    }

    loadResume();
  })();
</script>
</body>
</html>
