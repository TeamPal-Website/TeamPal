<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | TeamPal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="./assets/logo.png" />

    <meta name="theme-color" content="#2e8b57">
    <style>

.page {
    height: 100vh;
    color: #2d3e56;
    position: relative;
}

body {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-optical-sizing: auto;
  font-weight: 700;
  font-style: normal;
  margin: 0;
  background-color: #fffffc;
}

.notification-container {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: auto;
    min-width: 280px;
    max-width: 500px;
    pointer-events: none;
}

.notification {
    background: #ffffff;
    border-radius: 8px;
    padding: 12px 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    animation: fadeInDown 0.25s ease-out;
    pointer-events: auto;
    border: 1px solid #0000001a;
    width: 100%;
}

@keyframes fadeInDown {
    from {
        transform: translateY(-20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes fadeOutUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-20px);
        opacity: 0;
    }
}

.notification.error {
    border-left: 3px solid #e05a2a;
    background: #fff6f4;
}

.notification.success {
    border-left: 3px solid #52c41a;
    background: #f6ffed;
}

.notification.warning {
    border-left: 3px solid #faad14;
    background: #fffbe6;
}

.notification-content {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
    color: #2d3e56;
    font-family: "Space Grotesk", system-ui, sans-serif;
    text-align: center;
}

.notification-close {
    cursor: pointer;
    font-size: 18px;
    color: #b5b5b5;
    transition: color 0.2s;
    line-height: 1;
    flex-shrink: 0;
    font-family: "Space Grotesk", system-ui, sans-serif;
}

.notification-close:hover {
    color: #F85A0B;
}

.form {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.wrapper {
    width: 33%;
    border: 1px solid #0000001a;
    border-radius: 10px;
    padding-left: 20px;
    background: white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

.wrapper .subtitle, .wrapper button {
    text-align: center;
    color:#2d3e56;
    font-family: "Space Grotesk", system-ui, sans-serif;
}

.wrapper h1 {
    font-size: 42px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 5px;
}

.auth-tabs {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 20px;
}

.auth-tab {
    font-size: 15px;
    font-weight: 500;
    padding: 5px 0;
    cursor: pointer;
    color: #b5b5b5;
    text-decoration: none;
    position: relative;
    transition: color 0.3s;
    letter-spacing: 0.3px;
}

.auth-tab:hover {
    color: #F85A0B;
}

.auth-tab.active {
    color: #F85A0B;
}

.auth-tab.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: #F85A0B;
    border-radius: 2px;
}

.wrapper p {
    font-size: 16px;
    font-weight: 400;
    color: #b5b5b5;
    padding-bottom: 15px;
    margin-top: 0;
    text-align: center;
}

.login_wrapper label {
    font-size: 16px;
    font-weight: 500;
}

.login_wrapper {
    padding-bottom: 27px;
}

.password_wrapper label {
    font-size: 16px;
    font-weight: 500;
}

.password_wrapper {
    padding-bottom: 20px;
}

input {
    font-size: 16px;
    font-weight: 400;
    background-color: #f5f5f5;
    border: 1px solid transparent;
    border-radius: 7px;
    padding-left: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    width: 94%;
    margin-top: 10px;
    text-align: left;
    box-sizing: border-box;
    transition: all 0.2s;
}

input::placeholder {
    color: #808289;
}

input:focus {
    color: #212529;
    outline: 0;
    border-color: #F85A0B;
    box-shadow: 0 0 0 3px rgba(248, 90, 11, 0.1);
    transition: 0.2s;
}

input.error {
    border-color: #dc2626;
    background-color: #fff5f5;
}

.login_button {
    font-size: 16px;
    background-color: #F85A0B;
    margin-right: 20px;
    margin-bottom: 10px;
    border-radius: 10px;
}

button {
    padding-top: 10px;
    padding-bottom: 10px;
    color: white;
    background-color: black;
    margin-right: 20px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-style: none;
    text-align: center;
    width: 94%;
    cursor: pointer;
    transition: all 0.2s;
}

.login_button:hover {
    background-color: #e64e00;
}

.login_button:active {
    background-color: #e64e00;
}

.login_button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}

@media (max-width: 768px) {
    .wrapper {
        width: 85%;
    }
    
    .notification-container {
        top: 70px;
        width: 90%;
        max-width: 90%;
    }
    
    .notification {
        padding: 10px 16px;
    }
    
    .notification-content {
        font-size: 13px;
    }
}

    </style>
</head>
<body class="page">
    <div class="notification-container" id="notificationContainer"></div>
    
    <form class="form" id="loginForm" action="" method="post">
        <div class="wrapper">
            <h1 class="title">TeamPal</h1>
            
            <div class="auth-tabs">
                <a href="#" class="auth-tab active" id="loginTab">Войти</a>
                <a href="#" class="auth-tab" id="registerTab">Зарегистрироваться</a>
            </div>
            
            <p class="subtitle">Введите ваши данные для входа в систему</p>
            <div class="login_wrapper">
                <label for="email">Email</label>
                <div class="login_input">
                    <input type="email" id="email" name="email" placeholder="Введите ваш email" required>
                </div>
            </div>
            <div class="password_wrapper">
                <label for="password">Пароль</label>
                <div class="password_input">
                    <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
                </div>
            </div>
            <button class="login_button" id="submitBtn" type="submit">Войти</button>
        </div>
    </form>

    <script src="./config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const notificationContainer = document.getElementById('notificationContainer');

            function accountPageUrl() {
                try {
                    const role = localStorage.getItem('tp_role');
                    if (role === 'Ищу вакансию') {
                        return './account_employee.html';
                    }
                } catch (e) {}
                return './account_manager.html';
            }

            function isNetworkError(error) {
                const msg = error && error.message ? error.message : String(error);
                return (
                    (error && error.name === 'TypeError') ||
                    msg === 'Failed to fetch' ||
                    msg === 'Load failed' ||
                    (typeof msg === 'string' && msg.indexOf('NetworkError') !== -1)
                );
            }

            function showNotification(message, type = 'error', duration = 5000) {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                
                notification.innerHTML = `
                    <div class="notification-content">${message}</div>
                    <div class="notification-close">×</div>
                `;
                
                notificationContainer.appendChild(notification);
                
                const closeBtn = notification.querySelector('.notification-close');
                closeBtn.addEventListener('click', () => {
                    notification.style.animation = 'fadeOutUp 0.25s ease-out forwards';
                    setTimeout(() => {
                        notification.remove();
                    }, 250);
                });
                
                setTimeout(() => {
                    if (notification.parentElement) {
                        notification.style.animation = 'fadeOutUp 0.25s ease-out forwards';
                        setTimeout(() => {
                            notification.remove();
                        }, 250);
                    }
                }, duration);
            }

            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!email) return 'Поле email обязательно для заполнения';
                if (!emailRegex.test(email)) return 'Введите корректный email адрес';
                return null;
            }

            function validatePassword(password) {
                if (!password) return 'Поле пароля обязательно для заполнения';
                return null;
            }

            function resetFieldErrors() {
                const inputs = [emailInput, passwordInput];
                inputs.forEach(input => {
                    input.classList.remove('error');
                });
            }

            function setFieldError(input) {
                input.classList.add('error');
            }

            function validateForm() {
                resetFieldErrors();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                const emailError = validateEmail(email);
                if (emailError) {
                    setFieldError(emailInput);
                    return { isValid: false, error: emailError };
                }
                
                const passwordError = validatePassword(password);
                if (passwordError) {
                    setFieldError(passwordInput);
                    return { isValid: false, error: passwordError };
                }
                
                return { isValid: true, error: null };
            }

            async function getErrorText(response) {
                try {
                    const payload = await response.json();
                    if (typeof window.tpFormatApiDetail === "function") {
                        const s = window.tpFormatApiDetail(payload.detail);
                        if (s) return s;
                    }
                    if (typeof payload.detail === 'string' && payload.detail) {
                        return payload.detail;
                    }
                } catch (error) {
                    console.error(error);
                }
                return 'Ошибка запроса';
            }

            async function checkSession() {
                try {
                    const response = await fetch(API_BASE_URL + '/auth/me', {
                        method: 'GET',
                        credentials: 'include',
                    });
                    if (response.ok) {
                        window.location.href = accountPageUrl();
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            emailInput.addEventListener('blur', function() {
                const error = validateEmail(this.value.trim());
                if (error) {
                    setFieldError(this);
                } else {
                    this.classList.remove('error');
                }
            });
            
            passwordInput.addEventListener('blur', function() {
                const error = validatePassword(this.value);
                if (error) {
                    setFieldError(this);
                } else {
                    this.classList.remove('error');
                }
            });
            
            loginTab.addEventListener('click', function(e) {
                e.preventDefault();
            });
            
            registerTab.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = './registration_page.html';
            });

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const validation = validateForm();
                if (!validation.isValid) {
                    showNotification(validation.error, 'error');
                    return;
                }
                
                submitBtn.disabled = true;

                try {
                    if (typeof API_BASE_URL === 'undefined') {
                        showNotification('Ошибка конфигурации: API_BASE_URL не определен', 'error');
                        submitBtn.disabled = false;
                        return;
                    }

                    const response = await fetch(API_BASE_URL + '/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            email: emailInput.value.trim(),
                            password: passwordInput.value,
                        }),
                    });

                    if (!response.ok) {
                        const errorText = await getErrorText(response);
                        showNotification(errorText, 'error');
                        submitBtn.disabled = false;
                        return;
                    }
                    
                    showNotification('Вход выполнен успешно! Перенаправление...', 'success', 1500);
                    setTimeout(() => {
                        window.location.href = accountPageUrl();
                    }, 1000);
                    
                } catch (error) {
                    console.error(error);
                    if (isNetworkError(error)) {
                        showNotification('Не удалось подключиться к серверу. Проверьте, что бэкенд запущен.', 'error');
                    } else {
                        showNotification('Не удалось выполнить вход. Попробуйте позже.', 'error');
                    }
                    submitBtn.disabled = false;
                }
            });

            checkSession();
        });
    </script>
</body>
</html>
