services:
  db:
    image: postgres:16-alpine
    container_name: team_pal_db
    environment:
      POSTGRES_DB: team_pal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_pal"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: team_pal_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: team_pal
      JWT_SECRET_KEY: team-pal-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
