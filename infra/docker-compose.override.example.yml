# Локальная разработка (не для прода).
# Один раз: cp infra/docker-compose.override.example.yml infra/docker-compose.override.yml
# Запуск как обычно: docker compose -f infra/docker-compose.yml up --build
# Сайт: http://localhost:8000/registration_page.html
services:
  app:
    ports:
      - "8000:8000"
    volumes:
      - ../frontend:/app/frontend:ro

  nginx:
    ports: !override
      - "80:80"
    volumes: !override
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
