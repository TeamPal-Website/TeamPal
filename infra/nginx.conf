# Ограничение запросов: 10 в секунду с одного IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# Ограничение на API: 5 в секунду (строже)
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
# Ограничение одновременных соединений: не более 20 с одного IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    limit_conn conn_limit 20;

    # Аватарки и файлы из MinIO
    location /s3/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio;
    }

    # Статика — если файл есть, отдать; иначе — в FastAPI
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ @backend;
    }

    location @backend {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
